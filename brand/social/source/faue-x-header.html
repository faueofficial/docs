<!doctype html><meta charset=utf-8><style>

:root{--obs:#051611;--forest:#0F3D2E;--sage:#BCC9C4;--peach:#FBE6D9;--gold:#E7A83D;--paper:#F7F8F8}

.copy{position:absolute;left:260px;top:92px}

.chips{margin-top:26px;font-size:19px;color:var(--paper);display:flex;gap:22px}
.rule{position:absolute;left:260px;top:358px;width:84px;height:4px;background:var(--gold);border-radius:2px}
.contact{position:absolute;left:260px;top:386px;font-size:20px;color:var(--sage);letter-spacing:.01em}
.contact b{color:var(--paper);font-weight:600}
.word{position:absolute;right:46px;top:52px;font-size:340px;line-height:1;letter-spacing:-.02em;filter:drop-shadow(0 24px 36px rgba(0,0,0,.55))}
