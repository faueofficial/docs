openapi: 3.1.0

info:
  title: FAUE Gateway API
  version: 1.0.0
  description: |
    The single public API for FAUE. Consumed by the Flutter app (`faue-app`) and the
    web surfaces (`faue-web`). Generate clients from this document rather than
    hand-writing them.

    **Stage tags** appear in each operation's description: `MVP`, `M1-2`, `M3+`, `Y2`.
    Operations tagged beyond `MVP` are specified but not yet implemented.

    **Consent.** Operations that require a consent purpose declare it in their
    description as `Consent: <purpose>`. A missing grant returns `403` with
    `type: consent_required` and the purpose in `errors[]` — the client should
    present the consent surface, not an error dialog.

    **Errors** are RFC 7807 problem documents. See `docs/40-frontend/error-model.md`.

    **Long-running work** returns `202` with a job envelope. See
    `docs/40-frontend/realtime.md`.
  contact:
    name: FAUE Backend
    email: hello@faueofficial.com

servers:
  - url: https://api.faueofficial.com/v1
    description: Production
  - url: https://staging-api.faueofficial.com/v1
    description: Staging (fixtures available via X-Mock-Mode)
  - url: http://localhost:8000/v1
    description: Local

tags:
  - name: auth
    description: Magic link, OAuth, session lifecycle
  - name: profile
    description: Profile, body profile, consent
  - name: quiz
    description: Style DNA
  - name: vault
    description: The user's own wardrobe
  - name: looks
    description: Look generation and saved looks
  - name: fabric
    description: Fabric analysis and tailor share
  - name: spree
    description: Conversational styling
  - name: agent
    description: Proactive daily styling
  - name: integrations
    description: Pinterest
  - name: notifications
    description: Inbox, preferences, device tokens
  - name: uploads
    description: Signed upload credentials
  - name: privacy
    description: Data subject rights
  - name: contact
    description: Messages from the website's contact and partners forms
  - name: early-access
    description: Pre-launch waitlist, joined from the website after taking the quiz
  - name: cards
    description: Style DNA cards as images, and the public page behind a shared card
  - name: unsubscribe
    description: Stopping email, without signing in
  - name: shares
    description: Share a look from TikTok, Instagram or Pinterest, as a link or an image
  - name: studio
    description: Events, tailors and what you have told ASE
  - name: context
    description: Rough location and the weather there

security:
  - bearerAuth: []

paths:

  # ─────────────────────────────── auth ───────────────────────────────

  # ─────────────────────────────── early access ───────────────────────

  /early-access:
    post:
      tags: [early-access]
      summary: Join the waitlist
      description: |
        `MVP` Reserves a username and puts an email address on the waitlist, with the
        Style DNA the person just got. **No sign-in needed.**

        The answers are scored again on the server and stored with the signup. The
        response carries the card for those answers, so the website can show it as the
        reward for joining in one round trip.

        The username is a **reservation**: when someone signs up with the same email
        address they can take it with `POST /auth/username`, and nobody else can. A
        handle that is reserved, in use, or reads as official (`admin`, `faue`,
        `support`, ...) returns **409** `username_taken` with `username` as the field.

        An address that is already on the list is answered exactly like a first
        submission, so the response cannot be used to find out who has joined. A
        confirmation email is sent once.

        `consent` must be `true` and `policy_version` is stored with the signup.
        `website` is a honeypot. Limited to 5 per hour and 20 per day per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, quiz_version, answers, consent, policy_version]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                username: { type: string, minLength: 3, maxLength: 24, pattern: '^[a-zA-Z0-9_.]+$' }
                quiz_version: { type: string }
                answers:
                  type: object
                  description: |
                    Question id to the chosen option id, or to a list of option ids when the question
                    takes more than one (`max_choices` in `GET /quiz`). A single choice may be sent as a
                    plain string. Order and repeats do not matter.
                  additionalProperties:
                    oneOf:
                      - { type: string, example: 'A' }
                      - { type: array, minItems: 1, maxItems: 4, items: { type: string }, example: ['A', 'D'] }
                  example: { '1': ['A', 'C'], '2': 'C', '3': 'D', '4': ['A', 'D'], '5': 'A', '6': 'A' }
                gender:
                  type: string
                  enum: [female, male, prefer_not_to_say]
                  description: |
                    From the waitlist form's dropdown. Optional so a client that predates it keeps working.
                    It only decides which model photograph sits behind the person's card:
                    `female` and `male` get a photograph from their own Style DNA, and `prefer_not_to_say`
                    (or leaving it out) gets the plain card.
                consent: { type: boolean, enum: [true], description: Agreement to be emailed when FAUE opens. }
                policy_version: { type: string, maxLength: 40 }
                website: { type: string, maxLength: 200, description: Honeypot. Must be empty. }
      responses:
        '202':
          description: On the list.
          content:
            application/json:
              schema:
                type: object
                required: [status, username, dna]
                properties:
                  status: { type: string, enum: [joined] }
                  username: { type: string, description: 'The name asked for, echoed back. Never what is stored.' }
                  dna:
                    allOf: [{ $ref: '#/components/schemas/DnaResult' }]
                    description: |
                      The result for the submitted answers. `dna.card_urls` carries signed image addresses
                      for the person's own card (`stories_url` 9:16, `square_url` 4:5) and `share_url`, the
                      public page whose link preview shows the card.
                  card_photo:
                    type: [string, 'null']
                    enum: [f1, f2, m1, m2, null]
                    description: Which model photograph is behind the card, or null for the plain card.
        '409':
          description: '`username_taken`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { description: A field failed validation. Nothing was saved. }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ─────────────────────────────── contact ────────────────────────────

  /contact:
    post:
      tags: [contact]
      summary: Send a message to the FAUE team
      description: |
        `MVP` Saves a message from the website's contact or partners form and emails
        the FAUE team. **No sign-in needed**: the sender may have no account. If a
        valid access token is sent the message is linked to that account; an invalid
        one is ignored rather than refused.

        **Retention:** the sender's name, email address, message and any partner
        details are deleted **72 hours** after they arrive. Only a reference, the
        topic and dates remain. The privacy notice says the same; change both together.

        `Idempotency-Key` is required. A retry with the same key returns the original
        reference and creates nothing new. Limited to 5 per hour and 20 per day per IP
        address; beyond that the answer is `429` with `Retry-After`.

        `website` is a honeypot. People never see it, and a non-empty value is answered
        exactly like a success while nothing is stored.

        `topic: press_partnership` is delivered to the partners mailbox and may carry
        `partner_type`, `organisation` and `role`; every other topic goes to the
        general mailbox.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
          description: Unique per submission, printable characters only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, name, email, message, policy_version]
              properties:
                topic: { type: string, enum: [support, data_request, press_partnership, other] }
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 254 }
                message: { type: string, minLength: 10, maxLength: 4000 }
                reference_code:
                  type: string
                  maxLength: 64
                  description: The reference an app error showed, so support can find that request.
                partner_type:
                  type: string
                  enum: [tailor, designer, fabric_seller, event_planner, stylist_creator, media, other]
                organisation: { type: string, maxLength: 120 }
                role: { type: string, maxLength: 80 }
                policy_version:
                  type: string
                  maxLength: 40
                  description: The privacy policy version the sender saw and agreed to.
                website:
                  type: string
                  maxLength: 200
                  description: Honeypot. Must be empty.
      responses:
        '202':
          description: Saved. The team is emailed asynchronously; the sender is not told whether that has happened.
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties:
                  reference: { type: string, example: FAUE-7K4M2Q, description: Short code to quote when following up. }
        '400':
          description: '`idempotency_key_required` — the header is missing or malformed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: A field failed validation. Nothing was saved.
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/link/request:
    post:
      tags: [auth]
      summary: Request a magic link
      description: |
        `MVP` Sends a sign-in link to the given email address. Always returns `202`,
        whether or not the address is registered — revealing which addresses exist
        is an account-enumeration vector.

        `session_challenge` is an opaque value the client generates and retains. If
        the link is opened on a different device, the landing page falls back to a
        6-digit code the user types into this session.

        **Mobile app.** Send `X-Platform: mobile` (or `Platform: mobile`) and the email carries a
        **six-digit code** to type into the app instead of a link to open. The response says which
        in `method`. Finish with `POST /auth/link/consume` and `{email, code}`. Any other value, or no
        header, gets the link exactly as before.
      security: []
      parameters:
        - name: X-Platform
          in: header
          required: false
          schema: { type: string, enum: [mobile], example: mobile }
          description: >
            Say the request comes from the mobile app, so a six-digit code is emailed instead of a
            link. `Platform` is accepted as an alias, and the value may be written as JSON
            (`{"platform": "mobile"}`). Browsers need the header allowed in CORS, which it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, session_challenge]
              properties:
                email: { type: string, format: email }
                session_challenge:
                  type: string
                  minLength: 16
                  maxLength: 128
                  description: Client-generated opaque value binding the request to this device.
                surface:
                  type: string
                  enum: [app, web]
                  default: app
                  description: |
                    Where the person is signing in, which decides where the emailed link opens. `app`
                    (the default) opens on the site's own address, which the mobile app claims. `web`
                    opens on the web app's address, which always stays in the browser. Send what is true;
                    a link has to open on the surface that holds the session challenge.
      responses:
        '202':
          description: >
            Link dispatched if the address is valid. Every field below is derived
            from the request, so this body is byte-identical for a registered
            address and an unknown one — that is deliberate, and no field that
            depends on account existence may be added to it.
          content:
            application/json:
              schema:
                type: object
                required: [delivery, masked_destination, expires_in, resend_available_in, method]
                properties:
                  delivery:
                    type: string
                    enum: [email, sms]
                    description: Where the code went. `email` today; `sms` arrives in M1-2 — read this rather than assuming.
                  masked_destination:
                    type: string
                    example: 'ad••••@example.com'
                    description: For the check-email screen. Derived from the address you sent, so it reveals nothing.
                  expires_in: { type: integer, example: 600, description: Seconds until the link stops working }
                  resend_available_in:
                    type: integer
                    example: 60
                    description: >
                      Seconds until another request is accepted. Drive the resend
                      cooldown from this rather than a hardcoded value — the two
                      disagree the moment the server rule changes.
                  method:
                    type: string
                    enum: [link, code]
                    default: link
                    description: >
                      What was emailed: a `link` to open, or a six-digit `code` to type. Decided by the
                      platform header, never by the address, so it reveals nothing about the account.
                      `expires_in` is the lifetime of whichever was sent.
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/link/consume:
    post:
      tags: [auth]
      summary: Consume a magic link token
      description: |
        `MVP` Exchanges a magic-link token for a session. **POST only** — mail security
        scanners pre-fetch URLs, so a GET that consumed the token would burn the login
        before the user tapped it.

        Single-use. A second attempt with the same token returns `410`.

        When `session_challenge` does not match the one from the request, the response
        is `409` with a `device_code`; the user types that code into the original
        session, which then calls this endpoint again with `device_code` set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: By link
                  type: object
                  required: [token]
                  properties:
                    token: { type: string }
                    session_challenge: { type: string }
                    device_code: { type: string, description: 'Supplied when completing a cross-device sign-in' }
                - title: By emailed code (mobile app)
                  type: object
                  required: [email, code]
                  description: >
                    The six digits emailed after `POST /auth/link/request` with `X-Platform: mobile`, with
                    the address they were sent to. Signs the person in, or signs them up if the address is
                    new, and is the same account the link would reach. A code works once, expires after
                    `expires_in` seconds, and is burned after 5 wrong tries (ask for a new one).
                  properties:
                    email: { type: string, format: email }
                    code: { type: string, pattern: '^\d{6}$', example: '482916' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409':
          description: Opened on a different device; complete with the returned code
          content:
            application/json:
              schema:
                type: object
                required: [device_code_required]
                properties:
                  device_code_required: { type: boolean, const: true }
                  device_code: { type: string, description: '6-digit code to enter in the original session' }
        '410': { description: 'Token already used or expired', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401':
          description: >
            `login_code_invalid`: the code is wrong (the detail says how many tries are left), or none
            was requested for this address. The person can try again.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/google:
    post:
      tags: [auth]
      summary: Sign in with Google
      description: |
        `MVP` Verifies the Google ID token server-side against Google's JWKS,
        checking `iss`, `aud`, `nonce`, and `exp`. A client-supplied profile is
        never trusted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, nonce]
              properties:
                id_token: { type: string }
                nonce: { type: string }
      responses:
        '200': { description: 'Signed in', content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/oauth/apple:
    post:
      tags: [auth]
      summary: Sign in with Apple
      description: |
        `MVP` Verifies the Apple identity token against Apple's JWKS.

        **`full_name` is returned by Apple only on first authorization.** The client
        must forward it on that first call; it is unrecoverable afterwards.

        Private-relay addresses (`@privaterelay.appleid.com`) are normal and must not
        be treated as invalid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token]
              properties:
                identity_token: { type: string }
                authorization_code: { type: string }
                full_name: { type: string, description: 'Present only on first authorization' }
                nonce: { type: string }
      responses:
        '200': { description: 'Signed in', content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the session
      description: |
        `MVP` Exchanges a refresh token for a new pair. Refresh tokens rotate on every
        use. Presenting an already-rotated token revokes the entire family — that is
        theft detection, and the correct client response is to sign the user out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: 'Rotated', content: { application/json: { schema: { $ref: '#/components/schemas/RefreshedSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: |
        `MVP` Revokes the refresh token sent, and ends that session only; other devices stay signed in.
        Idempotent: an already revoked or unknown token still returns 204, so a retry after a network
        failure needs no special case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: 'Signed out' }

  /auth/username:
    post:
      tags: [auth]
      summary: Set the username
      description: '`MVP` The post-signup username step. Usernames are unique, case-insensitive.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 24, pattern: '^[a-zA-Z0-9_.]+$' }
      responses:
        '200': { description: 'Set', content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '409': { description: 'Already taken', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ─────────────────────────── profile & consent ───────────────────────────

  /me:
    get:
      tags: [profile]
      summary: Current user
      description: '`MVP` Profile, quiz state, consent summary, and onboarding progress in one call — used on app launch.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [profile, onboarding, consents]
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
                  onboarding: { $ref: '#/components/schemas/OnboardingState' }
                  consents:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
    patch:
      tags: [profile]
      summary: Update profile
      description: '`MVP` Partial update. Only supplied fields change.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 60 }
                gender_presentation: { $ref: '#/components/schemas/GenderPresentation' }
                city: { type: string, maxLength: 80 }
                locale: { type: string, example: 'en-NG' }
                avatar_asset_id: { type: string, format: uuid }
      responses:
        '200': { description: 'Updated', content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }

  /me/body-profile:
    get:
      tags: [profile]
      summary: Get body profile
      description: |
        `MVP` `Consent: personalization`

        Sensitive data. Every field is optional and independently omittable. Absent
        values are returned as `null`, never as guesses.
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/BodyProfile' } } } }
        '403': { $ref: '#/components/responses/ConsentRequired' }
    put:
      tags: [profile]
      summary: Set body profile
      description: |
        `MVP` `Consent: personalization`

        Drives hard constraints in look generation — silhouette rules, not vector
        similarity. Never sent to a model in raw form; `ase` receives abstract
        constraints such as `favor: defined_waist`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BodyProfile' }
      responses:
        '200': { description: 'Saved', content: { application/json: { schema: { $ref: '#/components/schemas/BodyProfile' } } } }
        '403': { $ref: '#/components/responses/ConsentRequired' }

  /me/consents:
    get:
      tags: [profile]
      summary: List consent state
      description: '`MVP` Every purpose and its current state. Purposes not yet granted appear with `granted: false`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
    put:
      tags: [profile]
      summary: Grant or revoke a consent purpose
      description: |
        `MVP` Revocation takes effect immediately and stops all processing for that
        purpose. Revoking `ai_processing` disables generation; revoking
        `pinterest_sync` also revokes the upstream token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, granted, policy_version]
              properties:
                purpose: { $ref: '#/components/schemas/ConsentPurpose' }
                granted: { type: boolean }
                policy_version: { type: string, example: '2026-08-17' }
      responses:
        '200': { description: 'Updated', content: { application/json: { schema: { $ref: '#/components/schemas/Consent' } } } }

  # ──────────────────────────────── quiz ────────────────────────────────

  /quiz:
    get:
      tags: [quiz]
      summary: Get quiz definition
      description: |
        `MVP` Questions, options, copy, and layout for the current quiz version.

        **Render option layouts from this response, never from a hardcoded grid.**
        Q6 has three options where the others have four.
      security: []
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/QuizDefinition' } } } }

  /quiz/preview:
    post:
      tags: [quiz]
      summary: Score answers without an account
      description: |
        `MVP` Scores answers and returns the Style DNA result. **No sign-in needed and
        nothing is stored or published.** The result is the one `POST /quiz/submit` would
        give for the same answers, except `card_urls.status` is `not_applicable` and
        `retake_available_at` is `null`. Limited per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_version, answers]
              properties:
                quiz_version: { type: string }
                answers:
                  type: object
                  description: Question id to option id, or a list of option ids, as for `POST /quiz/submit`.
                  additionalProperties:
                    oneOf:
                      - { type: string }
                      - { type: array, minItems: 1, maxItems: 4, items: { type: string } }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnaResult' }
        '422': { description: Answers are missing or not valid options. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /quiz/submit:
    post:
      tags: [quiz]
      summary: Submit answers
      description: |
        `MVP` Scores synchronously and returns the result immediately. Card rendering
        is asynchronous — `card_urls.status` will be `pending`; poll `/quiz/card`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_version, answers]
              properties:
                quiz_version: { type: string, example: 'dna-2026-08-v1' }
                answers:
                  type: object
                  description: |
                    Question id to the chosen option id, or to a list of option ids when the question
                    takes more than one (`max_choices` in `GET /quiz`). A single choice may be sent as a
                    plain string. Order and repeats do not matter.
                  additionalProperties:
                    oneOf:
                      - { type: string, example: 'A' }
                      - { type: array, minItems: 1, maxItems: 4, items: { type: string }, example: ['A', 'D'] }
                  example: { '1': ['A', 'C'], '2': 'C', '3': 'D', '4': ['A', 'D'], '5': 'A', '6': 'A' }
      responses:
        '200': { description: 'Scored', content: { application/json: { schema: { $ref: '#/components/schemas/DnaResult' } } } }
        '409': { description: 'Retake not yet available', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /quiz/result:
    get:
      tags: [quiz]
      summary: Get current result
      description: '`MVP`'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DnaResult' } } } }
        '404': { description: 'Quiz not completed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /quiz/card:
    get:
      tags: [quiz]
      summary: Get share card URLs
      description: '`MVP` Returns `status: pending` until the render completes; poll every 2 seconds, up to 30 seconds.'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/CardUrls' } } } }

  /quiz/retake:
    post:
      tags: [quiz]
      summary: Reset for a retake
      description: '`MVP` Allowed once per 30 days. `retake_available_at` on the result says when.'
      responses:
        '204': { description: 'Reset' }
        '409': { description: 'Too soon', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ─────────────────────────────── uploads ───────────────────────────────

  /uploads/sign:
    post:
      tags: [uploads]
      summary: Get signed upload credentials
      description: |
        `MVP` `Consent: camera_photos`

        Returns a short-lived, single-use upload URL. `PUT` the image to it.

        **Not direct-to-CDN.** The bytes reach the gateway so the PII pipeline
        can run before anything is stored — a direct upload would put the
        unredacted original on the CDN, including images that are then
        rejected.

        After upload the asset enters the PII pipeline — safety classification, EXIF
        strip, face redaction, OCR redaction. Until `status` is `ready` the asset
        cannot be referenced by other endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content_type]
              properties:
                kind: { type: string, enum: [vault, fabric, avatar, share], description: '`share` is a screenshot sent with a share to FAUE.' }
                content_type: { type: string, enum: ['image/jpeg', 'image/png', 'image/heic', 'image/webp'] }
                byte_size: { type: integer, maximum: 20971520, description: 'Maximum 20 MB' }
      responses:
        '201':
          description: Credentials issued
          content:
            application/json:
              schema:
                type: object
                required: [asset_id, upload_url, expires_at]
                properties:
                  asset_id: { type: string, format: uuid }
                  upload_url: { type: string, format: uri }
                  fields: { type: object, description: 'Form fields to include with the upload' }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/ConsentRequired' }

  /uploads/{asset_id}:
    get:
      tags: [uploads]
      summary: Get asset status
      description: '`MVP` Poll after uploading. `status` is `processing`, `ready`, or `rejected`.'
      parameters: [{ $ref: '#/components/parameters/AssetId' }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [uploads]
      summary: Upload the image bytes
      description: |
        `MVP` `Consent: camera_photos`

        Where the bytes go after `POST /uploads/sign`. Send the image as `multipart/form-data` with one
        field, `file`. The PII pipeline runs in memory and only the redacted derivative is stored.
        Then poll `GET /uploads/{asset_id}` until `status` is `ready` or `rejected`.
      parameters: [{ $ref: '#/components/parameters/AssetId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Accepted', content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [processing, ready, rejected] } } } } } }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'Larger than the upload limit' }

  # ──────────────────────────────── vault ────────────────────────────────

  /vault/items:
    get:
      tags: [vault]
      summary: List vault items
      description: '`MVP` Cursor-paginated. Categories match the app: tops, bottoms, native, shoes, accessories.'
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/VaultCategory' } }
        - { name: q, in: query, schema: { type: string }, description: 'Free-text search over name and notes' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/VaultItem' } }
    post:
      tags: [vault]
      summary: Add a vault item
      description: '`MVP` The asset must be `ready`. The item is embedded asynchronously and becomes available to generation within seconds.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id, name, category]
              properties:
                asset_id: { type: string, format: uuid }
                name: { type: string, maxLength: 80 }
                category: { $ref: '#/components/schemas/VaultCategory' }
                colors: { type: array, items: { type: string }, maxItems: 4 }
                fabric: { type: string }
                brand: { type: string }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { description: 'Created', content: { application/json: { schema: { $ref: '#/components/schemas/VaultItem' } } } }

  /vault/items/{item_id}:
    parameters: [{ $ref: '#/components/parameters/ItemId' }]
    get:
      tags: [vault]
      summary: Get a vault item
      description: '`MVP`'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/VaultItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [vault]
      summary: Edit a vault item
      description: '`MVP`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                category: { $ref: '#/components/schemas/VaultCategory' }
                colors: { type: array, items: { type: string } }
                fabric: { type: string }
                brand: { type: string }
                notes: { type: string, maxLength: 500 }
      responses:
        '200': { description: 'Updated', content: { application/json: { schema: { $ref: '#/components/schemas/VaultItem' } } } }
    delete:
      tags: [vault]
      summary: Remove a vault item
      description: '`MVP` Permanent. The app shows a confirmation modal; the server does not.'
      responses:
        '204': { description: 'Removed' }

  /vault/items/{item_id}/style:
    post:
      deprecated: true
      tags: [vault]
      summary: Style this item (not served)
      description: |
        `MVP` `Consent: ai_processing`

        **Not served by the gateway today.** Use `POST /looks/generate` with this item, or
        `POST /fabric/{asset_id}/style` for fabric. Kept here until the app stops referring to it.

        Starts look generation seeded by this item — the "Style this item" action.
        Returns a job envelope; see `/looks/jobs/{job_id}`.
      parameters: [{ $ref: '#/components/parameters/ItemId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                occasion: { $ref: '#/components/schemas/Occasion' }
                note: { type: string, maxLength: 280 }
      responses:
        '202': { description: 'Job accepted', content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }
        '403': { $ref: '#/components/responses/ConsentRequired' }

  /vault/items/{item_id}/restore:
    post:
      tags: [vault]
      summary: Restore a deleted item
      description: '`MVP` Deleting an item only hides it. It can be restored for 30 days; after that the images are removed from every store and this is `409`. Wear history keeps the item''s name and category either way.'
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Restored }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Past the retention period, or its image is gone }

  /vault/wear:
    post:
      tags: [vault]
      summary: Log a wear
      description: |
        `MVP` Records what was actually worn. This is the strongest behavioural signal
        the system has and what the agent learns from — worth prompting for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids, worn_on]
              properties:
                item_ids: { type: array, items: { type: string, format: uuid }, minItems: 1 }
                look_id: { type: string, format: uuid }
                occasion: { $ref: '#/components/schemas/Occasion' }
                worn_on: { type: string, format: date }
      responses:
        '201': { description: 'Logged' }

  # ──────────────────────────────── looks ────────────────────────────────

  /fabric/{asset_id}/tailor-share:
    post:
      tags:
      - fabric
      summary: Tailor Share
      description: 'The card for your tailor, as a JPEG to send over WhatsApp: your fabric, the style, what to make, notes and measurements.


        Image-first: the tailor may never tap a link, so the picture carries everything, in large type on a plain ground that reads on a

        cracked screen in poor light. Measurements go into the picture only; they are not stored or logged. The illustration, when there is

        one, is labelled as an illustration.'
      operationId: tailor_share_v1_fabric__asset_id__tailor_share_post
      security:
      - bearerAuth: []
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Asset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailorShareIn'
      responses:
        '200':
          description: Successful Response
          content:
            image/jpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ──────────────────────────────── spree ────────────────────────────────

  /agent/settings:
    get:
      tags:
      - agent
      summary: Get Agent Settings
      description: 'How your daily suggestion behaves: whether it runs each day, at what hour, whether it uses the weather, and how much it does
        on its own.


        `built_level` is the highest `autonomy_level` that does anything today (0: a suggestion when the app opens). Higher levels are kept for

        when they exist.'
      operationId: get_agent_settings_v1_agent_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Agent Settings V1 Agent Settings Get
      security:
      - bearerAuth: []
    put:
      tags:
      - agent
      summary: Update Agent Settings
      description: 'Change how your daily suggestion behaves. Send only the fields you are changing.


        Turning on the daily suggestion, or any autonomy level above 0, is **403** unless you have granted `agent_proactive`; the problem names

        that consent so the app can ask for it.'
      operationId: update_agent_settings_v1_agent_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSettingsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Update Agent Settings V1 Agent Settings Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []

  /integrations:
    get:
      tags: [integrations]
      summary: List connected accounts
      description: '`MVP` Backs the Connected Accounts screen. `status` is `needs_reauth` when Pinterest rejected the stored token (show Connect again) and `syncing` while an import runs (poll this until it changes). Instagram is not offered — the platform API cannot deliver what it would promise.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Integration' }

  /integrations/pinterest/authorize:
    get:
      tags: [integrations]
      summary: Begin Pinterest connection
      description: '`MVP` `Consent: pinterest_sync` Returns the Pinterest authorization URL (authorization code flow; read-only scopes `boards:read` and `pins:read`). Open it in the browser. After the person decides, Pinterest calls the callback, which redirects the browser into the app with `?pinterest=connected`, `denied` or `error`. `state` is single use and valid for 10 minutes. `503` when the app has no Pinterest credentials.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, state]
                properties:
                  authorize_url: { type: string, format: uri }
                  state: { type: string }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '503': { description: 'Pinterest is not configured or not answering' }

  /integrations/pinterest/callback:
    get:
      tags: [integrations]
      summary: OAuth callback
      description: '`MVP` Called by Pinterest, not by the client. Checks and consumes `state`, exchanges the code, stores the tokens encrypted, and redirects into the app. It never returns an error body: the outcome is the `pinterest` query parameter on the redirect (`connected`, `denied` when the person declined, `error` for anything else).'
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: 'Redirect into the app with ?pinterest=connected, denied or error' }

  /integrations/pinterest/boards:
    get:
      tags: [integrations]
      summary: List boards
      description: '`MVP` `Consent: pinterest_sync` The signed-in person''s own boards, for them to choose from. Never import everything by default. `imported` is true for a board imported before. `404` when Pinterest is not connected, `409` when it needs reconnecting, `403` when Pinterest refuses the content (not retryable), `503` when Pinterest is not answering.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PinterestBoard' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Needs reconnecting, or an import is already running' }

  /integrations/pinterest/boards/{board_id}/pins:
    get:
      tags:
      - integrations
      summary: Pinterest Board Pins
      description: 'The pins on one of your boards, a page at a time, so you can look before you import.


        Read live from Pinterest and not stored. A board that is not yours, or that Pinterest will not show this app, is **403**; a

        connection that needs signing in again is **409**; Pinterest being busy is **503**.'
      operationId: pinterest_board_pins_v1_integrations_pinterest_boards__board_id__pins_get
      security:
      - bearerAuth: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          title: Board Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 24
          title: Limit
      - name: bookmark
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Bookmark
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinterestPins'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /integrations/pinterest/import:
    post:
      tags: [integrations]
      summary: Import selected boards
      description: '`MVP` `Consent: pinterest_sync` Asynchronous. Imports up to 200 pins from each chosen board, at most 10 boards per request. Every id must be a board of the connected account, otherwise `422`. `409` while another import is running. Poll `GET /integrations` until `status` is no longer `syncing`. Pin images are not copied until they can pass the PII pipeline; until then a pin keeps its Pinterest image address.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [board_ids]
              properties:
                board_ids: { type: array, items: { type: string }, minItems: 1, maxItems: 50 }
      responses:
        '202': { description: 'Import started', content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Needs reconnecting, or an import is already running' }
        '422': { description: 'Empty choice, too many boards, or a board that is not in the account' }

  /integrations/{provider}:
    delete:
      tags: [integrations]
      summary: Disconnect
      description: '`MVP` Deletes the stored token and every imported pin. Never gated by consent, and safe to repeat. Pinterest documents no token-revocation call, so access ends by deleting ours; the person can also remove FAUE in Pinterest''s own settings. Withdrawing `pinterest_sync` does the same.'
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [pinterest] } }]
      responses:
        '204': { description: 'Disconnected' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── notifications ─────────────────────────────

  /notifications:
    get:
      tags: [notifications]
      summary: Notification inbox
      description: '`MVP` Backs the Notification screen, newest first, with the unread count for the badge. `category` maps to its All / Style / Activity tabs.'
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [style, activity] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, unread_count]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }
                      unread_count: { type: integer }

  /notifications/{notification_id}/read:
    post:
      tags: [notifications]
      summary: Mark as read
      description: '`MVP`'
      parameters: [{ name: notification_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: 'Marked' }

  /notifications/preferences:
    get:
      tags: [notifications]
      summary: Get preferences
      description: '`MVP` Every category on every channel (15 entries), with the default where the person never chose. Marketing is off until turned on.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationPreference' }
    put:
      tags: [notifications]
      summary: Update preferences
      description: '`MVP` The body is the **complete** set: anything omitted reverts to its default, so read first and send back modified. A channel turned off is skipped at delivery. Quiet hours need both ends or neither. Returns the resulting set.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/NotificationPreference' }
      responses:
        '200':
          description: The resulting preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationPreference' }
        '422': { description: Unknown category or channel, a duplicate, or bad quiet hours }

  /notifications/devices:
    post:
      tags: [notifications]
      summary: Register a device token
      description: '`MVP` Safe to call on every launch: the same token updates its registration instead of duplicating. At most 10 devices are kept per person. Tokens are stored encrypted and deleted with the account.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios, android, web] }
                token: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [device_id, created]
                properties:
                  device_id: { type: string, format: uuid }
                  created: { type: boolean, description: False when the token was already registered. }

  /notifications/devices/{device_id}:
    delete:
      tags: [notifications]
      summary: Remove a device
      description: '`MVP` Stop push to one device, for example on sign-out.'
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────── privacy ───────────────────────────────

  /privacy/export:
    post:
      tags: [privacy]
      summary: Request a data export
      description: |
        `MVP` Assembles everything held about the person (profile, body profile, consents, Style DNA,
        quiz answers, uploads, vault, wear log, saved looks, connected accounts and imported pins,
        notifications and waitlist entry). Sign-in secrets and stored provider tokens are not included.

        Returns **202** with a job; fetch `poll_url` for the archive. It is kept for seven days and
        stored encrypted.
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/JobEnvelope' } } } }

  /privacy/export/{export_id}:
    get:
      tags: [privacy]
      summary: Download a data export
      description: '`MVP` The archive as a JSON attachment. `404` once it has expired, and for anyone but the person it describes.'
      parameters:
        - { name: export_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'The archive', content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /privacy/delete:
    post:
      tags: [privacy]
      summary: Delete the account
      description: |
        `MVP` Schedules the account for deletion. **Sessions end at once, on every device.**

        The data is **kept for a waiting period** (`purge_after`, 14 days by default) so a deletion
        made by mistake can be undone with `DELETE /privacy/delete`. Signing in during that time
        reaches only `GET` and `DELETE /privacy/delete` and `POST /auth/logout`; every other route
        returns `403 account_pending_deletion`. When the period ends everything the gateway holds
        (profile, style, uploads and their stored images, vault, imported pins, the Pinterest token,
        notifications, and the waitlist entry for the same address) is removed, and the deletion
        ledger tracks the other modules (`ase`) to the 30-day legal deadline.

        Asking again while a request is open returns the same one.

        Required by the App Store for any app offering Sign in with Apple, so this is
        launch-blocking rather than optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, const: true }
                reason: { type: string, maxLength: 500 }
      responses:
        '202':
          description: Deletion scheduled. Sign the person out and clear local data.
          content:
            application/json:
              schema:
                type: object
                required: [ledger_id, sla_due_at]
                properties:
                  ledger_id: { type: string, format: uuid }
                  sla_due_at: { type: string, format: date-time }
                  purge_after: { type: [string, 'null'], format: date-time, description: 'When the data is removed. Until then the request can be cancelled.' }
        '422': { description: '`confirm` missing or not true.' }
    get:
      tags: [privacy]
      summary: Is a deletion waiting?
      description: '`MVP` Reachable while the account is scheduled for deletion. Show the date and the cancel action.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [none, scheduled] }
                  ledger_id: { type: string, format: uuid }
                  requested_at: { type: string, format: date-time }
                  purge_after: { type: string, format: date-time }
                  sla_due_at: { type: string, format: date-time }
    delete:
      tags: [privacy]
      summary: Cancel a scheduled deletion
      description: |
        `MVP` Only possible before `purge_after`; afterwards `409` and the data is gone. Returns a
        fresh session, because the token used here is limited to the deletion routes: **replace the
        stored tokens with the ones returned.**
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [status, access_token, refresh_token, expires_in]
                properties:
                  status: { type: string, enum: [cancelled] }
                  access_token: { type: string }
                  refresh_token: { type: string }
                  expires_in: { type: integer }
        '409': { description: 'Nothing waiting, or the data has already been removed.' }

  /privacy/restrict:
    post:
      tags: [privacy]
      summary: Restrict processing
      description: |
        `MVP` Pauses all optional processing while keeping the account and its data. While it is in
        force every purpose except `essential` is refused with `403 forbidden` ("processing is
        restricted"), whatever consent was given. Nothing is deleted.
      responses:
        '204': { description: 'Restricted' }
    delete:
      tags: [privacy]
      summary: Lift the restriction
      description: '`MVP` Optional processing works again under the consents the person already gave.'
      responses:
        '204': { description: 'Lifted' }

  # ──────────────────────────────── shares ────────────────────────────────

  /shares:
    post:
      tags: [shares]
      summary: Share a look
      description: |
        `MVP` By link, by image, or both. Links to a single **TikTok**, **Instagram** or
        **Pinterest** post are accepted, with or without tracking parameters; short links
        (`vm.tiktok.com`, `pin.it`) are followed. Any other address is `422` with advice to
        share a screenshot.

        When the link gives no picture the item is kept with `status: needs_image` and a
        `reason` (`no_preview`, or `unavailable` when the post could not be read). Ask for a
        screenshot, upload it with `kind: share`, and send it to `PUT /shares/{id}/image`.
        Instagram links usually need this: Instagram no longer publishes a cover image.

        Sharing the same post again returns the existing item with `200`. `title` and
        `author_name` are written by strangers: show them as plain text.

        Limited to 30 per hour and 100 per day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, maxLength: 2048 }
                asset_id: { type: string, format: uuid, description: 'An upload with `status: ready`.' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SharedItem' } } } }
        '200': { description: Already shared, content: { application/json: { schema: { $ref: '#/components/schemas/SharedItem' } } } }
        '404': { description: The image is not yours }
        '409': { description: The image has not finished processing }
        '422': { description: Nothing to share, or not a link to a single post }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [shares]
      summary: Shared looks
      description: '`MVP` Newest first.'
      parameters:
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SharedItem' } }
                  next_before: { type: [string, 'null'], format: date-time }

  /shares/{share_id}:
    parameters:
      - { name: share_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shares]
      summary: One shared look
      description: '`MVP`'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SharedItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [shares]
      summary: Remove a shared look
      description: '`MVP`'
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /shares/{share_id}/image:
    put:
      tags: [shares]
      summary: Attach a screenshot
      description: '`MVP` For a share with `status: needs_image`. The image must be yours and `ready`.'
      parameters:
        - { name: share_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id: { type: string, format: uuid }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SharedItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The image has not finished processing }

  /share-events:
    post:
      tags: [shares]
      summary: Record that a card was shared
      description: |
        `MVP` **No sign-in needed.** Call it when someone sends a Style DNA card to Stories or as
        a post, copies the link, or uses the share sheet. Only the kind, the surface, the card's
        dominant persona id and the time are kept: no account, address or IP address. It feeds
        the "shared from FAUE" count in the console. Limited to 120 per hour per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [story, post, link, native] }
                surface: { type: string, enum: [web, app], default: web }
                persona: { type: string, minLength: 2, maxLength: 2, example: CM }
      responses:
        '204': { description: Recorded }
        '422': { description: Unknown kind }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/phone:
    get:
      tags: [profile]
      summary: The saved phone number
      description: '`MVP` Masked, with whether it is verified.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { phone: { type: [string, 'null'], example: '+234******678' }, verified: { type: boolean } } } } } }
    put:
      tags: [profile]
      summary: Save a number and send it a code
      description: |
        `MVP` Sends a six digit code by SMS, or by WhatsApp with `via`. A Nigerian number may be given
        as `0803...`. Until the code is entered the number is unverified and nothing else is sent to
        it. Limited to 3 an hour and 5 a day. `503` when the channel is not available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, minLength: 7, maxLength: 24 }
                via: { type: string, enum: [sms, whatsapp], default: sms }
      responses:
        '202': { description: Code sent }
        '422': { description: Not a valid number }
        '503': { description: SMS or WhatsApp is not available }
    delete:
      tags: [profile]
      summary: Forget the number
      description: '`MVP` SMS and WhatsApp stop at once.'
      responses:
        '204': { description: Removed }

  /me/phone/verify:
    post:
      tags: [profile]
      summary: Enter the code
      description: '`MVP` Ten minutes and five tries, then ask for a new code (`409`).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, minLength: 4, maxLength: 8 } } }
      responses:
        '200': { description: Verified }
        '409': { description: Expired, or too many attempts }
        '422': { description: Wrong code }

  # ──────────────────────────────── cards and sharing ────────────────────────────────

  /cards/dna.png:
    get:
      tags: [cards]
      summary: A Style DNA card as a PNG
      description: |
        `MVP` **No sign-in needed**, because email clients and link previews load it.

        Draws one card. The address is **signed**: it carries the personas, percentages, handle, shape and
        photograph plus a `sig` the server made, so only a card the server issued can be drawn. Take the
        full address from `dna.card_urls` or `images` in `GET /dna/{token}`; do not build one.

        A changed or unsigned address returns **401**. The image never changes for an address, so it is
        sent with `Cache-Control: public, max-age=31536000, immutable`.
      security: []
      parameters:
        - { name: p, in: query, required: true, schema: { type: string, example: 'CM.49,CE.39,SL.12' }, description: 'Persona id and percentage, dominant first.' }
        - { name: w, in: query, schema: { type: integer, minimum: 120, maximum: 1200, default: 1080 }, description: 'Width in pixels. Height follows the shape.' }
        - { name: a, in: query, schema: { type: string, enum: ['4x5', '9x16', og], default: '4x5' }, description: '`9x16` for Stories, `4x5` for a feed post, `og` (1200x630) for link previews.' }
        - { name: u, in: query, schema: { type: string }, description: 'The handle signed on the card.' }
        - { name: pl, in: query, schema: { type: string, enum: [signature, tag, chip, trait], default: signature } }
        - { name: ph, in: query, schema: { type: string, enum: [f1, f2, m1, m2] }, description: 'The model photograph behind the card.' }
        - { name: sig, in: query, required: true, schema: { type: string }, description: 'Server signature over the other parameters.' }
      responses:
        '200': { description: 'The card', content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dna/{token}:
    get:
      tags: [cards]
      summary: The data behind a shared Style DNA card
      description: |
        `MVP` **No sign-in needed.** What the public share page and its link preview are built from.

        `token` is the last part of a `share_url` (`https://faueofficial.com/dna/<token>`). It is signed by
        the server and carries the personas, percentages, handle and photograph, so only an issued card can
        be shown and nothing about the person is looked up. A changed or invented token returns **401**.
        The answer never changes for a token and is cached for an hour.

        Apps can use it to render a native "shared card" screen from a link they receive.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The card', content: { application/json: { schema: { $ref: '#/components/schemas/SharedCard' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────────── unsubscribe ────────────────────────────────

  /unsubscribe/{token}:
    get:
      tags: [unsubscribe]
      summary: What an unsubscribe link is for
      description: |
        `MVP` **No sign-in needed.** Says what the link would turn off, and changes nothing, so a mail
        scanner that opens every link in a message cannot unsubscribe anyone. `category` is `waitlist`
        (leave the list, releasing the reserved username) or an account category such as `marketing`.
        A forged or damaged token returns **401**.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [category], properties: { category: { type: string, example: waitlist } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [unsubscribe]
      summary: Unsubscribe
      description: |
        `MVP` **No sign-in needed.** The token is the credential. Also what a mail client's own one-click
        Unsubscribe button posts to (RFC 8058, from the `List-Unsubscribe` header). Idempotent: repeating
        it, or using a link for an entry that no longer exists, still answers 200.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Done', content: { application/json: { schema: { $ref: '#/components/schemas/UnsubscribeResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /community/posts:
    post:
      tags: [community]
      summary: Share a look with the community
      description: |
        Shows one of your looks to people with a similar style. The look is read from its source, not from this request, so
        this is **503** until looks are available. Others see the image, occasion, your caption and a style label, never
        your name. `confirm` must be `true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [look_id, confirm]
              properties:
                look_id: { type: string, maxLength: 64 }
                caption: { type: string, maxLength: 140 }
                confirm: { type: boolean }
      responses:
        '201': { description: Shared, content: { application/json: { schema: { type: object } } } }
        '404': { description: Not your look }
        '409': { description: Taken down by a moderator }
        '503': { description: Looks are not available yet }

  /community/feed:
    get:
      tags: [community]
      summary: Looks from similar styles
      description: Closest style first (your dominant style, then alter ego or wildcard), then newest. Your own looks are not included. No item names or links to its author.
      parameters:
        - { in: query, name: occasion, schema: { type: string, maxLength: 40 } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /community/posts/mine:
    get:
      tags: [community]
      summary: What you have shared
      description: Your published and hidden looks with likes and copies.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /community/posts/{post_id}:
    delete:
      tags: [community]
      summary: Take your look down
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Taken down }
        '404': { description: Not yours }

  /community/posts/{post_id}/like:
    put:
      tags: [community]
      summary: Like a look
      description: Safe to repeat.
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { description: No such post }
    delete:
      tags: [community]
      summary: Take a like back
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /community/posts/{post_id}/copy:
    post:
      tags: [community]
      summary: Take a look's recipe as the start of your own
      description: Returns the occasion and recipe to hand to look generation. Counted once per person.
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '404': { description: No such post }

  /community/posts/{post_id}/report:
    post:
      tags: [community]
      summary: Report a look
      description: '`reason`: `inappropriate`, `not_fashion`, `spam` or `other`. One report per person; enough reports from different people hide the post (tunable: `community_hide_after_reports`).'
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [inappropriate, not_fashion, spam, other] }
      responses:
        '204': { description: Reported }
        '422': { description: Unknown reason }

  /community/copies:
    get:
      tags: [community]
      summary: Looks you have copied
      description: The posts whose recipe you took, newest first. Still anonymous.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }

  /events:
    get:
      tags: [studio]
      summary: Your events, soonest first
      description: Each event carries `days_until`. At most 50 per person.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/StudioEvent' } } } } } } }
    post:
      tags: [studio]
      summary: Add an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_on]
              properties:
                title: { type: string, minLength: 2, maxLength: 80 }
                kind: { type: string, enum: [wedding, owambe, church, naming, work, travel, other], default: other }
                starts_on: { type: string, format: date, description: Not more than a few weeks in the past. }
                city: { type: string, maxLength: 60, nullable: true }
                has_fabric: { type: boolean, default: false }
                reminders: { type: array, maxItems: 4, uniqueItems: true, items: { type: string, enum: ['0d', 1d, 3d, 7d] }, default: [3d], description: 'Any combination of the day itself and 1, 3 or 7 days before. Empty means none. Each is sent once, between 08:00 and 20:00 Lagos time.' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StudioEvent' } } } }
        '409': { description: Event limit reached }
        '422': { description: Invalid event }

  /events/{event_id}:
    patch:
      tags: [studio]
      summary: Edit an event
      description: Send `reminders` as the full list you want; changing it or the date re-arms the reminders still ahead.
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudioEvent' } } } }
        '404': { description: Not yours }
    delete:
      tags: [studio]
      summary: Remove an event
      parameters:
        - { in: path, name: event_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '404': { description: Not yours }

  /tailors:
    get:
      tags: [studio]
      summary: Your tailors
      description: The phone number is stored encrypted and returned only to you.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Tailor' } } } } } } }
    post:
      tags: [studio]
      summary: Add a tailor
      description: The first tailor becomes the default. The number is normalised to E.164. At most 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                phone: { type: string, minLength: 7, maxLength: 24 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Tailor' } } } }
        '409': { description: Tailor limit reached }
        '422': { description: Not a valid phone number }

  /tailors/{tailor_id}:
    patch:
      tags: [studio]
      summary: Rename a tailor or make them the default
      parameters:
        - { in: path, name: tailor_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                is_default: { type: boolean }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tailor' } } } }
        '404': { description: Not yours }
    delete:
      tags: [studio]
      summary: Remove a tailor
      parameters:
        - { in: path, name: tailor_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '404': { description: Not yours }

  /me/location:
    put:
      tags: [context]
      summary: Set your rough location
      description: Needs the `location_weather` consent. Only a 5-character geohash (about 5 km) is kept, for 30 days; the coordinates sent are discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        '204': { description: Stored }
        '403': { description: Consent `location_weather` not granted }
        '422': { description: Coordinates out of range }
    delete:
      tags: [context]
      summary: Forget your location
      responses:
        '204': { description: Cleared }

  /me/context:
    get:
      tags: [context]
      summary: The weather where you are
      description: '`weather` is null when no location is set or the forecast provider is unreachable. Cached per cell for 30 minutes.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weather:
                    nullable: true
                    type: object
                    properties:
                      temp_c: { type: integer }
                      condition: { type: string, enum: [clear, cloudy, fog, rain, storm, mixed] }
                      rain_probability: { type: integer, minimum: 0, maximum: 100 }
  /looks/generate:
    post:
      tags:
      - looks
      summary: Generate Looks
      description: 'Generate looks from your wardrobe.


        Asynchronous: returns a job envelope; poll `GET /v1/looks/jobs/{job_id}` or follow the stream. With an empty wardrobe the

        result is reviewed archetype looks, labelled `mode: archetype`. Send `Idempotency-Key` to make a retry return the same job.

        Requires `ai_processing` consent; without it the call is **403**.'
      operationId: generate_looks_v1_looks_generate_post
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Send the same key to retry a request safely.
          title: Idempotency-Key
        description: Send the same key to retry a request safely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateIn'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Generate Looks V1 Looks Generate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /looks/jobs/{job_id}:
    get:
      tags:
      - looks
      summary: Get Job
      description: 'Poll a generation job.


        The job envelope returned by `POST /v1/looks/generate`, `/regenerate` or `/adjust`. Poll until `status` is `done` or
        `failed`

        (it passes through `queued`, `analyzing`, `assembling` and `rendering`). On `done` the body carries the looks; on `failed`,

        a reason code, and the attempt was not counted against you. Prefer `GET /v1/looks/jobs/{job_id}/stream` if you can consume

        SSE: it removes the polling.'
      security:
      - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object

  /looks/jobs/{job_id}/stream:
    get:
      tags:
      - looks
      summary: Stream Job
      description: 'SSE: `progress` as the job moves, then `done` or `failed`, then the stream closes.'
      security:
      - bearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object

  /looks:
    get:
      tags:
      - looks
      summary: List Looks
