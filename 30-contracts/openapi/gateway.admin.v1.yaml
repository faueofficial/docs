openapi: 3.1.0
info:
  title: FAUE Admin API
  version: 1.0.0
  description: |
    Internal operations console API. **Never exposed on the public domain**, never
    publicly linked, and deliberately absent from the customer-facing OpenAPI
    document — the app generates its client from `gateway.v1.yaml`, and admin
    routes have no business in it.

    A separate auth realm from `/v1/*`: different audience claim, different
    identity table, shorter absolute session. A user token cannot authenticate
    here and an admin token cannot authenticate against `/v1/*`.

    Only the operational surface is specified so far. Style library, review
    queue, user support, flags and the deletion ledger follow the build order in
    `docs/20-services/admin.md` §9.

servers:
  - url: https://api.faueofficial.com/admin/v1
    description: Behind the network gate — VPN, SSO or IP allowlist.

security:
  - adminBearer: []

tags:
  - name: admin-auth
    description: Magic link, then TOTP. Two factors from genuinely different places.
  - name: admin-ops
    description: Health, queues and delivery outcomes.
  - name: admin-console
    description: Who is signed in, the overview numbers, the audit log and the team.
  - name: admin-contact
    description: 'Website messages: read, mark and reply.'
  - name: admin-waitlist
    description: 'Early-access members: read, invite, write to, mark as left, delete.'
  - name: admin-integrations
    description: 'Connected accounts and the pins imported through them.'
  - name: admin-lifecycle
    description: 'Lifecycle campaigns: state and results.'
  - name: admin-settings
    description: 'Tunable, non-secret values: thresholds, limits and clean-up periods.'
  - name: admin-flags
    description: 'Feature switches: pause a feature without a deploy.'
  - name: admin-media
    description: 'Uploads, storage, backup and sharing, as counts.'
  - name: admin-privacy
    description: 'Deletion requests, and accounts: reveal an address, delete an account.'

paths:
  /auth/link/request:
    post:
      tags: [admin-auth]
      summary: Request a sign-in link
      security: []
      description: |
        Always `202`, whatever the address. Which addresses hold admin accounts
        is precisely the list an attacker wants before choosing who to phish, so
        the response cannot depend on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Link dispatched if the address belongs to an active admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_in: { type: integer, example: 600 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/link/consume:
    post:
      tags: [admin-auth]
      summary: Complete sign-in with the link and a TOTP code
      security: []
      description: |
        Both factors are checked before either is spent, so a mistyped code does
        **not** burn the link — otherwise every typo costs a fresh email.

        A code cannot be replayed. TOTP codes stay valid for roughly 90 seconds
        including drift allowance, and used codes are held for that span.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token: { type: string }
                code: { type: string, example: '318204', description: 'Six digits from the authenticator.' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { description: 'Link expired or already used.' }
        '403': { description: 'Wrong or already-used code. The link is still valid.' }
        '428':
          description: >
            Account has not completed MFA enrolment. Not a refusal — the body
            carries an enrolment token, and the console shows the QR flow.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/EnrolmentRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/enrol:
    post:
      tags: [admin-auth]
      summary: Begin MFA enrolment
      security: []
      description: |
        Authorised by an enrolment token rather than a session: a new admin has
        no session yet, and the link they clicked already proved inbox control.

        `provisioning_uri` contains the secret. Show it once as a QR code; never
        log it, never re-display it. An already-enrolled account cannot re-enrol
        itself — a live session could otherwise swap the second factor for one
        an attacker controls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolment_token]
              properties:
                enrolment_token: { type: string }
      responses:
        '200':
          description: Secret issued. Enrolment is not complete until confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [secret, provisioning_uri]
                properties:
                  secret: { type: string }
                  provisioning_uri: { type: string, example: 'otpauth://totp/FAUE:ada%40faueofficial.com?secret=...&issuer=FAUE' }
        '401': { description: 'Enrolment token expired or already spent.' }
        '403': { description: 'Already enrolled.' }

  /auth/mfa/confirm:
    post:
      tags: [admin-auth]
      summary: Confirm MFA enrolment
      security: []
      description: |
        `mfa_enrolled` flips here, not when the secret was issued. A stored
        secret only proves one was generated; if the operator never successfully
        scanned it, treating them as enrolled locks them out permanently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolment_token, code]
              properties:
                enrolment_token: { type: string }
                code: { type: string }
      responses:
        '204': { description: 'Enrolled. The enrolment token is now spent.' }
        '401': { description: 'Enrolment token expired or already spent.' }
        '403': { description: 'That code did not match.' }

  /auth/sessions:
    get:
      tags: [admin-auth]
      summary: List live sessions
      description: |
        Every live session on this account, newest first.

        `current` marks the session making the call — without it you cannot tell
        which row is the device in your hand, and ending the wrong one signs you
        out.

        The raw user-agent is never stored; `device` is a coarse label, which is
        enough to answer "is one of these not me?" without keeping a
        fingerprint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/AdminSessionRow' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/sessions/{jti}:
    delete:
      tags: [admin-auth]
      summary: End one session
      description: |
        The lever people actually need: not "end everything", but "end that
        session on the laptop I left at the office".

        Only your own. The storage key is namespaced by account, so another
        account's session id is not there and returns `404` — the same as an
        unknown or already-ended session, which an operator on a stale screen
        should learn about rather than be told it worked.
      parameters:
        - name: jti
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 'Session ended. That device stops working immediately.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: 'No such session on this account.' }

  /auth/logout:
    post:
      tags: [admin-auth]
      summary: End this session
      description: |
        Scoped to the session making the call. Signing out of a laptop must not
        sign you out of a phone — anything broader and people stop signing out.
      responses:
        '204': { description: 'Session ended. The token stops working immediately.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/sessions/revoke:
    post:
      tags: [admin-auth]
      summary: End every session this account holds
      description: |
        The lever for a lost device. A timestamp cutoff rather than a list —
        sessions cannot be enumerated, and the point is reaching the ones nobody
        knows about. Includes the session making the call.

        A cutoff, not a ban: signing in again works. A permanent block is
        `status = 'suspended'`, a different decision.
      responses:
        '204': { description: 'All sessions ended.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admins/invite:
    post:
      tags: [admin-auth]
      summary: Invite an admin
      description: |
        `Capability: role.write` — admin only. Granting a role is effectively
        granting everything that role can reach.

        Creates the account but **not** access: `status = 'invited'` cannot sign
        in until MFA enrolment activates it. An invite that produced a usable
        account would make a forwarded email an admin account.

        Invites last three days and are single-use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [viewer, curator, support, ml_ops, admin] }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [invited] }
                  role: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '409': { description: 'That address already has an admin account.' }
        '422': { description: 'Unknown role.' }

  /auth/invite/accept:
    post:
      tags: [admin-auth]
      summary: Accept an invitation
      security: []
      description: |
        Unauthenticated by necessity — the invitee has no session yet, and the
        token in the mail is the credential. Single-use, so a forwarded invite
        is spent rather than live.

        Returns an enrolment token; enrolment then follows the same two calls as
        any other account, and confirming it activates the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token]
              properties:
                invite_token: { type: string }
      responses:
        '200':
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                required: [enrolment_token]
                properties:
                  enrolment_token: { type: string }
        '401': { description: 'Invite expired or already used.' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /ops/health:
    get:
      tags: [admin-ops]
      summary: Per-dependency health
      description: |
        `Capability: ops.read`

        Not a boolean. Which dependency is down decides what to do next, and a
        single flag collapses "the API is serving but Redis is down" into the
        same value as "everything is fine".

        `partial` is the state that matters: requests are being served while
        something behind them is not.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /ops/events:
    get:
      tags: [admin-ops]
      summary: Event backlog
      description: |
        `Capability: ops.read_queues`

        `unpublished` and `parked` are different problems. Unpublished means the
        relay is behind and usually catches up on its own. Parked means those
        events exist and **no consumer will ever see them** without someone
        intervening — an incident, not a queue depth.

        Parked rows are named individually, because a count does not say which
        handler to fix.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventBacklog' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /ops/notifications:
    get:
      tags: [admin-ops]
      summary: Delivery outcomes
      description: |
        `Capability: ops.read_queues`

        "Notifications are broken" is not actionable. "62 suppressed for
        `no_consent`, 3 failed on `provider_unavailable`" says which of those is
        a bug and which is the system working — suppression usually is, which is
        why it reads as `partial` rather than `failure`.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24, minimum: 1, maximum: 720 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  # ───────────────────────────── console ─────────────────────────────

  /me:
    get:
      tags: [admin-console]
      summary: Who is signed in, and what they may do
      description: |
        The console calls this first. `capabilities` is the list the role holds, so the console can show
        only the pages the role can open. The API enforces every capability regardless.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /overview:
    get:
      tags: [admin-console]
      summary: The numbers on the console's front page
      description: |
        `Capability: ops.read`. Counts and 30 day series, no personal data. A section the role cannot read
        (`waitlist` needs `waitlist.read`, `contact` needs `contact.read`) is `null`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /audit:
    get:
      tags: [admin-console]
      summary: The audit log
      description: |
        `Capability: audit.read` (admin role). Newest first. Entries hold the action, the target and a few
        non-personal facts. Message text and email addresses are never written to the log.
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 60 }, description: 'An action, or the start of one: `waitlist`, `contact.replied`.' }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /admins:
    get:
      tags: [admin-console]
      summary: Everyone with a console account
      description: '`Capability: role.write` (admin role). Whether MFA is set up, never the factor itself.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  # ───────────────────────────── contact messages ─────────────────────────────

  /contact/messages:
    get:
      tags: [admin-contact]
      summary: List website messages
      description: |
        `Capability: contact.read`. Newest first, with a one-line preview. `counts` are for the whole inbox,
        not the page. Opening the list is audited (that it happened, never the text).
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContactStatus' } }
        - { name: topic, in: query, schema: { $ref: '#/components/schemas/ContactTopic' } }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: 'Pass `next_before` from the previous page.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContactList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /contact/messages/{message_id}:
    parameters:
      - { name: message_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin-contact]
      summary: Read one message
      description: '`Capability: contact.read`. Audited. A message past its 72 hour retention has `purged: true` and no text or address.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '404': { description: No such message }
    patch:
      tags: [admin-contact]
      summary: Mark a message
      description: '`Capability: contact.write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ContactStatus' }
      responses:
        '200': { description: The message, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '404': { description: No such message }
        '422': { description: Unknown status }

  /contact/messages/{message_id}/reply:
    post:
      tags: [admin-contact]
      summary: Reply to a message by email
      description: |
        `Capability: contact.write`. Emails the person from the FAUE team, with their own message quoted
        underneath, and marks the message `replied`. Replies to it come back to the team mailbox for the
        topic. Nothing is saved if sending fails. The reply text is not stored and not written to the audit log.

        Refused with **409** once the message is past retention, because there is no address left.
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [status, reference]
                properties:
                  status: { type: string, enum: [replied] }
                  reference: { type: string, example: FAUE-7K4M2Q }
        '409': { description: 'Past retention, or the provider failed. Nothing was marked.' }
        '404': { description: No such message }

  # ───────────────────────────── waitlist ─────────────────────────────

  /waitlist:
    get:
      tags: [admin-waitlist]
      summary: List waitlist members
      description: '`Capability: waitlist.read`. Newest first. Search by exact email address or by the start of a username.'
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WaitlistStatus' } }
        - { name: dominant, in: query, schema: { type: string, maxLength: 4, example: CM }, description: 'Dominant Style DNA persona id.' }
        - { name: q, in: query, schema: { type: string, maxLength: 254 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /waitlist/summary:
    get:
      tags: [admin-waitlist]
      summary: Waitlist totals
      description: '`Capability: waitlist.read`. Totals only, no personal data.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistSummary' } } } }

  /waitlist/{entry_id}:
    parameters:
      - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin-waitlist]
      summary: One member, with their quiz answers and scores
      description: '`Capability: waitlist.read`. Audited.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistDetail' } } } }
        '404': { description: No such member }
    patch:
      tags: [admin-waitlist]
      summary: Change a member's status
      description: |
        `Capability: waitlist.write`. Setting `invited` **sends the launch email** ("FAUE is open"), once;
        setting it again does not email twice. If the email fails the status is not changed. A member who
        has unsubscribed cannot be invited (**409**). `unsubscribed` stops all email and releases the username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [waiting, invited, unsubscribed] }
      responses:
        '200': { description: The member, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistDetail' } } } }
        '409': { description: Unsubscribed members cannot be invited }
        '404': { description: No such member }
    delete:
      tags: [admin-waitlist]
      summary: Remove a member and delete their data
      description: |
        `Capability: waitlist.write`. Emails the person a short confirmation, then deletes the address,
        username and quiz answers. Audited as `waitlist.deleted` (the entry's id, never what was deleted).
      responses:
        '204': { description: Deleted }
        '404': { description: No such member }

  /waitlist/{entry_id}/message:
    post:
      tags: [admin-waitlist]
      summary: Write to one member
      description: |
        `Capability: waitlist.write`. One person at a time, on purpose. Refused for anyone who unsubscribed
        (**409**). The text is not stored or copied into the audit log, only that a message of that length
        was sent. A subject containing a line break is refused (**422**).
      parameters:
        - { name: entry_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, minLength: 2, maxLength: 150 }
                body: { type: string, minLength: 5, maxLength: 5000 }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [sent] } } } } } }
        '409': { description: The member unsubscribed }
        '422': { description: Invalid subject or body }

  /integrations:
    get:
      tags: [admin-integrations]
      summary: Connected accounts
      description: '`Capability: integration.read`. Newest connection first. Tokens are never returned. Audited. `summary` counts the whole set.'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, syncing, needs_reauth, revoked] } }
        - { name: provider, in: query, schema: { type: string, enum: [pinterest] } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationList' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /integrations/{account_id}/pins:
    get:
      tags: [admin-integrations]
      summary: Pins imported through one connection
      description: '`Capability: integration.read_pins`. Newest first, with the boards they came from. Titles and descriptions are text written by strangers on Pinterest: render as plain text. Audited.'
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: board_id, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PinList' } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such connected account }

  /integrations/{account_id}:
    delete:
      tags: [admin-integrations]
      summary: Disconnect on the person's behalf
      description: '`Capability: integration.write`. Deletes the stored token and every pin imported through it. The person is not notified. Audited.'
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Disconnected }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such connected account }

  /privacy/requests:
    get:
      tags: [admin-privacy]
      summary: Deletion requests
      description: '`Capability: deletion_ledger.read`. The deletion ledger. Unfinished requests come soonest deadline first. `scheduled` is inside the waiting period: the account is signed out but nothing has been removed and it can be cancelled. `summary` counts the whole ledger.'
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [scheduled, open, overdue, completed, cancelled] } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequestList' } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /privacy/requests/{ledger_id}/acknowledge:
    post:
      tags: [admin-privacy]
      summary: Record a module as purged
      description: '`Capability: deletion_ledger.write`. Verify first (see the DSR runbook). The note is kept in the audit log. The request closes when every module has been recorded. `409` for a module that is not part of the request.'
      parameters:
        - { name: ledger_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, note]
              properties:
                module: { type: string, example: ase }
                note: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionRequest' } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such request }
        '409': { description: The module is not part of this request }

  /accounts:
    get:
      tags: [admin-privacy]
      summary: Accounts
      description: '`Capability: user.read`. Newest first. Addresses are masked. `q` is the start of a username, or a full email address. Audited.'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 254 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountList' } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /accounts/{user_id}/reveal:
    post:
      tags: [admin-privacy]
      summary: Reveal an account's email address
      description: '`Capability: user.read_pii`. A reason of at least 10 characters is required and is stored in the audit log.'
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Justification' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such account }
        '422': { description: Reason missing or too short }

  /accounts/{user_id}/delete:
    post:
      tags: [admin-privacy]
      summary: Schedule an account for deletion
      description: |
        `Capability: user.delete`. The same as the person's own request: sessions end at once and the data
        is removed after the waiting period, during which `restore` undoes it. `immediate: true` removes it
        at the next purge pass instead and cannot then be undone. Idempotent while a request is open. A
        reason of at least 10 characters is required and is stored in the audit log.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/Justification' }
                - { type: object, properties: { immediate: { type: boolean, default: false } } }
      responses:
        '202': { description: Scheduled, content: { application/json: { schema: { type: object, required: [ledger_id, sla_due_at], properties: { ledger_id: { type: string, format: uuid }, sla_due_at: { type: string, format: date-time }, purge_after: { type: [string, 'null'], format: date-time } } } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such account }
        '422': { description: Reason missing or too short }

  /accounts/{user_id}/restore:
    post:
      tags: [admin-privacy]
      summary: Cancel a scheduled deletion
      description: '`Capability: user.delete`. Only before the data is removed (`409` after). The person signs in as normal. A reason is required and audited.'
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Justification' }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [restored] } } } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '409': { description: Nothing waiting, or already removed }

  /media/overview:
    get:
      tags: [admin-media]
      summary: Uploads and storage
      description: '`Capability: media.read`. Counts only: what is stored and refused, where, whether the backup is keeping up, and what the clean-up has left. No image, key or address.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /sharing/overview:
    get:
      tags: [admin-media]
      summary: Sharing, in and out
      description: '`Capability: media.read`. `to_faue` counts looks shared to FAUE by source; `from_faue` counts cards shared out by kind and surface, and shared links opened (which includes chat link previews).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /community/overview:
    get:
      tags: [admin-community]
      summary: Community counts
      description: '`Capability: community.read`. Posts by status, likes, copies and reports, shared per day, report reasons, and styles and occasions on show. Counts only: no author.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /community/posts:
    get:
      tags: [admin-community]
      summary: Shared looks
      description: '`Capability: community.read`. `reported=true` lists published posts with reports, most reported first. Otherwise newest first, filtered by `status` (`published`, `hidden`, `removed`). Posts carry no author.'
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [published, hidden, removed] } }
        - { in: query, name: reported, schema: { type: boolean } }
        - { in: query, name: before, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /community/posts/{post_id}/reports:
    get:
      tags: [admin-community]
      summary: Why a post was reported
      description: '`Capability: community.read`. Report reasons with counts. Not who reported.'
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such post }

  /community/posts/{post_id}/moderate:
    post:
      tags: [admin-community]
      summary: Hide a post or bring it back
      description: |
        `Capability: community.moderate`. `hide` removes the post from the feed and stops its author sharing the same look
        again; `restore` shows it again. A reason of at least three characters is required and goes in the audit log
        (`community.hide`, `community.restore`). A post its author took down cannot be restored by a moderator (409).
      parameters:
        - { in: path, name: post_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [hide, restore] }
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { description: The post as it now stands, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such post }
        '409': { description: Already in that state, or taken down by its author }

  /flags:
    get:
      tags: [admin-flags]
      summary: Feature switches
      description: '`Capability: flags.read`. Every switch with its default, current value and who last changed it. `enabled: true` means the feature is working.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /flags/{key}:
    put:
      tags: [admin-flags]
      summary: Turn a switch off or on
      description: |
        `Capability: flags.write`. Keys: `service` (whole product API into maintenance), `uploads`,
        `pinterest`, `shares`, `waitlist_signups`. A paused feature answers `503`. Takes effect
        within about ten seconds on every instance. A reason of at least 5 characters is
        required and is written to the audit log.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled: { type: boolean }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200': { description: The switch after the change }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '404': { description: No such switch }

  /waitlist/invite-batch:
    post:
      tags: [admin-waitlist]
      summary: Invite the next people on the list
      description: |
        `Capability: waitlist.write`. Sends the launch invite to the next `limit` (1 to 50) members
        who are still `waiting`, oldest first, optionally only one dominant style. Never selects
        anyone invited, joined or unsubscribed. Each person is committed on their own, so a
        provider failure part way leaves the ones already sent invited. `dry_run` only counts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 50, default: 25 }
                dominant: { type: string, maxLength: 4 }
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { selected: { type: integer }, invited: { type: integer }, failed: { type: integer }, dry_run: { type: boolean }, still_waiting: { type: integer } } } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /waitlist/export.csv:
    get:
      tags: [admin-waitlist]
      summary: Export the waitlist as CSV
      description: |
        `Capability: user.export`. Email, username, status, styles, gender and dates. `reason` (10 to
        300 characters) is required and is kept in the audit log with the row count. Members who
        unsubscribed are left out unless `status=unsubscribed` is asked for. Cells that begin with
        `=`, `+`, `-` or `@` are prefixed so a spreadsheet does not run them.
      parameters:
        - { name: reason, in: query, required: true, schema: { type: string, minLength: 10, maxLength: 300 } }
        - { name: status, in: query, schema: { type: string, enum: [waiting, invited, joined, unsubscribed] } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }
        '422': { description: Reason missing or too short }

  /settings:
    get:
      tags: [admin-settings]
      summary: Tunable settings
      description: '`Capability: settings.read`. Each with its type, bounds, default and what is in force. Secrets, keys and addresses are not tunable and are not listed.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

  /settings/{key}:
    put:
      tags: [admin-settings]
      summary: Change a setting
      description: '`Capability: settings.write`. Checked against the type and bounds in the list (`422` outside them); a reason of at least 5 characters is required and audited. Takes effect within about ten seconds; workers pick it up on their next pass.'
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason]
              properties:
                value: { description: A number or a boolean, per the setting's `kind`. }
                reason: { type: string, minLength: 5, maxLength: 300 }
      responses:
        '200': { description: The setting after the change }
        '404': { description: Not a tunable setting }
        '422': { description: Wrong type or outside the bounds }
    delete:
      tags: [admin-settings]
      summary: Return a setting to its default
      description: '`Capability: settings.write`.'
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The setting at its default }
        '404': { description: Not a tunable setting }

  /lifecycle/overview:
    get:
      tags: [admin-lifecycle]
      summary: Campaigns, state and results
      description: '`Capability: ops.read`. Whether campaigns are on (`lifecycle_enabled` under Settings), how many people agreed to marketing, and for each message what was sent and opened in the last 30 days. Counts only.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/MissingCapability' }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Admin session token, `aud: faue-admin`. Eight hours absolute, never
        sliding. The account is re-read from the database on every request, so a
        suspension or a demotion takes effect before the token expires.

  responses:
    RateLimited:
      description: >
        Admin sign-in is the highest-value endpoint in the system and is limited
        far more tightly than the user flow — a stolen link plus a brute-forced
        six-digit code is only 10^6 attempts.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Missing, invalid, or expired admin session — including a valid *user* token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MissingCapability:
      description: >
        The role lacks the capability. The message names the capability, because
        "forbidden" tells an operator nothing about what to grant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Me:
      type: object
      required: [id, role, capabilities, session_expires_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [viewer, curator, support, ml_ops, admin] }
        capabilities: { type: array, items: { type: string }, example: [ops.read, contact.read, contact.write] }
        session_expires_at: { type: string, format: date-time }

    DayCount:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer }

    WaitlistStatus: { type: string, enum: [waiting, invited, joined, unsubscribed] }
    ContactStatus: { type: string, enum: [new, replied, closed] }
    ContactTopic: { type: string, enum: [support, data_request, press_partnership, other] }

    Overview:
      type: object
      required: [generated_at, waitlist, contact, accounts, delivery]
      properties:
        generated_at: { type: string, format: date-time }
        waitlist:
          type: [object, 'null']
          description: 'Null without `waitlist.read`.'
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer }, description: 'Keys: waiting, invited, joined, unsubscribed.' }
            by_dominant: { type: object, additionalProperties: { type: integer }, description: 'Persona id to count.' }
            by_gender: { type: object, additionalProperties: { type: integer }, description: 'female, male, prefer_not_to_say, not_given.' }
            first_joined_at: { type: [string, 'null'], format: date-time }
            daily: { type: array, description: 'Exactly 30 entries, oldest first, zeros included.', items: { $ref: '#/components/schemas/DayCount' } }
            welcomed: { type: integer, description: 'Members whose confirmation email went out.' }
        contact:
          type: [object, 'null']
          description: 'Null without `contact.read`.'
          properties:
            counts: { type: object, additionalProperties: { type: integer }, description: 'Keys: new, replied, closed.' }
            by_topic: { type: object, additionalProperties: { type: integer } }
            daily: { type: array, items: { $ref: '#/components/schemas/DayCount' } }
            oldest_unanswered_at: { type: [string, 'null'], format: date-time }
        accounts:
          type: object
          properties:
            total: { type: integer }
            quiz_completed: { type: integer }
            by_dominant: { type: object, additionalProperties: { type: integer } }
        delivery:
          type: object
          properties:
            last_24h: { type: object, additionalProperties: { type: integer }, description: 'Notification outcome to count: sent, suppressed, failed.' }
            unpublished_events: { type: integer }

    AuditEntry:
      type: object
      required: [id, action, occurred_at, actor, target]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, example: waitlist.status_changed }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            id: { type: string, format: uuid }
            role: { type: string }
            email: { type: [string, 'null'] }
        target:
          type: object
          properties:
            type: { type: string, example: waitlist_entry }
            id: { type: [string, 'null'], format: uuid }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        ip: { type: [string, 'null'] }

    AuditList:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next_before: { type: [string, 'null'], format: date-time }

    TeamMember:
      type: object
      required: [id, email, role, status, mfa_enrolled, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [invited, active, suspended] }
        mfa_enrolled: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    Team:
      type: object
      required: [items, roles]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
        roles: { type: array, items: { type: string }, description: 'Roles an invitation may name.' }

    ContactSummary:
      type: object
      required: [id, reference, topic, topic_label, status, created_at, purged]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: FAUE-7K4M2Q }
        topic: { $ref: '#/components/schemas/ContactTopic' }
        topic_label: { type: string, example: Support and complaints }
        status: { $ref: '#/components/schemas/ContactStatus' }
        partner_type: { type: [string, 'null'], enum: [tailor, designer, fabric_seller, event_planner, stylist_creator, media, other, null] }
        created_at: { type: string, format: date-time }
        replied_at: { type: [string, 'null'], format: date-time }
        purged: { type: boolean, description: 'True once the 72 hour retention has deleted the text and sender.' }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        snippet: { type: [string, 'null'], description: 'First 140 characters, whitespace collapsed.' }

    ContactDetail:
      allOf:
        - { $ref: '#/components/schemas/ContactSummary' }
        - type: object
          properties:
            message: { type: [string, 'null'] }
            organisation: { type: [string, 'null'] }
            role: { type: [string, 'null'] }
            partner_type_label: { type: [string, 'null'] }
            reference_code: { type: [string, 'null'] }
            linked_account: { type: boolean }
            policy_version: { type: string }
            notified_at: { type: [string, 'null'], format: date-time }
            handled_by: { type: [string, 'null'], format: uuid }

    ContactList:
      type: object
      required: [items, next_before, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ContactSummary' } }
        next_before: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          properties:
            new: { type: integer }
            replied: { type: integer }
            closed: { type: integer }
            purged: { type: integer }

    WaitlistMember:
      type: object
      required: [id, username, email, status, dna, linked, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        status: { $ref: '#/components/schemas/WaitlistStatus' }
        dna:
          type: object
          properties:
            dominant: { type: string, example: CM }
            alter_ego: { type: [string, 'null'] }
            wildcard: { type: [string, 'null'] }
        linked: { type: boolean, description: 'Has an account with the same email address.' }
        created_at: { type: string, format: date-time }
        welcomed_at: { type: [string, 'null'], format: date-time }

    WaitlistDetail:
      allOf:
        - { $ref: '#/components/schemas/WaitlistMember' }
        - type: object
          properties:
            answers: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: array, items: { type: string } }] } }
            scores: { type: object, additionalProperties: { type: integer }, description: 'Raw persona scores. Percentages are recomputed from these.' }
            quiz_version: { type: string }
            policy_version: { type: string }
            consented_at: { type: string, format: date-time }
            source: { type: string, example: web_quiz }
            gender: { type: [string, 'null'], enum: [female, male, prefer_not_to_say, null] }
            invited_at: { type: [string, 'null'], format: date-time }
            unsubscribed_at: { type: [string, 'null'], format: date-time }

    WaitlistList:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WaitlistMember' } }
        next_before: { type: [string, 'null'], format: date-time }

    WaitlistSummary:
      type: object
      required: [total, by_status, by_dominant, first_joined_at]
      properties:
        total: { type: integer }
        by_status: { type: object, additionalProperties: { type: integer } }
        by_dominant: { type: object, additionalProperties: { type: integer } }
        first_joined_at: { type: [string, 'null'], format: date-time }

    AdminSessionRow:
      type: object
      required: [jti, created_at, expires_at, device, current]
      properties:
        jti: { type: string, description: 'Pass to DELETE /auth/sessions/{jti} to end it.' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ip: { type: [string, 'null'] }
        device:
          type: string
          example: 'Chrome on macOS'
          description: Coarse by design. The raw user-agent is a fingerprint and is not stored.
        current:
          type: boolean
          description: The session making this call. Ending it signs you out.

    AdminSession:
      type: object
      required: [access_token, token_type, expires_in, role]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 28800, description: 'Eight hours, absolute. Never renewed by activity.' }
        role: { type: string, enum: [viewer, curator, support, ml_ops, admin] }

    EnrolmentRequired:
      type: object
      required: [type, title, status, enrolment_token]
      properties:
        type: { type: string, example: 'mfa_enrolment_required' }
        title: { type: string }
        status: { type: integer, example: 428 }
        enrolment_token:
          type: string
          description: Short-lived, authorises exactly the two enrolment calls.

    OutcomeStatus:
      type: string
      enum: [success, partial, failure]
      description: >
        The same vocabulary the logs use. `partial` means it worked and
        something is still wrong — the state a boolean loses.

    DependencyState:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OutcomeStatus' }
        latency_ms: { type: number }
        reason:
          type: [string, 'null']
          description: >
            Exception type, not its message. The message varies per incident, so
            grouping by it produces one bucket per occurrence.

    HealthReport:
      type: object
      required: [status, degraded, checked_at, dependencies, failing]
      properties:
        status: { $ref: '#/components/schemas/OutcomeStatus' }
        degraded: { type: boolean }
        checked_at: { type: string, format: date-time }
        dependencies:
          type: object
          additionalProperties: { $ref: '#/components/schemas/DependencyState' }
        failing:
          type: array
          items: { type: string }

    ParkedEvent:
      type: object
      required: [event_id, event_name, attempts, occurred_at]
      properties:
        event_id: { type: string, format: uuid }
        event_name: { type: string, example: 'look.failed' }
        attempts: { type: integer }
        occurred_at: { type: string, format: date-time }

    EventBacklog:
      type: object
      required: [status, unpublished, parked, oldest_unpublished_at]
      properties:
        status: { $ref: '#/components/schemas/OutcomeStatus' }
        unpublished: { type: integer, description: 'Still retryable — the relay is behind.' }
        parked: { type: integer, description: 'Attempts exhausted. Nothing will publish these without intervention.' }
        oldest_unpublished_at: { type: [string, 'null'], format: date-time }
        unpublished_by_event:
          type: object
          additionalProperties: { type: integer }
        parked_events:
          type: array
          items: { $ref: '#/components/schemas/ParkedEvent' }

    DeliveryReport:
      type: object
      required: [window_hours, status, by_status, by_failure_reason]
      properties:
        window_hours: { type: integer }
        status: { $ref: '#/components/schemas/OutcomeStatus' }
        by_status:
          type: object
          additionalProperties: { type: integer }
          example: { sent: 412, suppressed: 62, failed: 3 }
        by_failure_reason:
          type: object
          additionalProperties: { type: integer }
          example: { no_consent: 62, provider_unavailable: 3 }
        by_channel:
          type: array
          items:
            type: object
            properties:
              channel: { type: string }
              status: { type: string }
              count: { type: integer }

    Justification:
      type: object
      required: [justification]
      properties:
        justification: { type: string, minLength: 10, maxLength: 500 }

    ConnectedAccount:
      type: object
      required: [id, user_id, provider, status, scopes, connected_at, boards_imported, pins_imported]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        provider: { type: string, enum: [pinterest] }
        status: { type: string, enum: [active, syncing, needs_reauth, revoked] }
        scopes: { type: array, items: { type: string } }
        connected_at: { type: string, format: date-time }
        last_sync_at: { type: [string, 'null'], format: date-time }
        token_expires_at: { type: [string, 'null'], format: date-time }
        boards_imported: { type: integer }
        pins_imported: { type: integer }

    IntegrationList:
      type: object
      required: [items, next_before, summary]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConnectedAccount' } }
        next_before: { type: [string, 'null'], format: date-time }
        summary:
          type: object
          required: [by_status, connected, pins_imported]
          properties:
            by_status: { type: object, additionalProperties: { type: integer }, example: { active: 12, needs_reauth: 1 } }
            connected: { type: integer }
            pins_imported: { type: integer }

    ImportedPin:
      type: object
      required: [id, pin_id, board_id, board_name, image_status, imported_at]
      properties:
        id: { type: string, format: uuid }
        pin_id: { type: string }
        board_id: { type: string }
        board_name: { type: string }
        title: { type: [string, 'null'], description: Untrusted text. Render as plain text. }
        description: { type: [string, 'null'], description: Untrusted text. Render as plain text. }
        image_url: { type: [string, 'null'], description: A Pinterest CDN address (i.pinimg.com). }
        image_status: { type: string, enum: [none, pending_detector, cached, rejected, failed] }
        imported_at: { type: string, format: date-time }

    PinList:
      type: object
      required: [account, boards, items, next_before]
      properties:
        account: { $ref: '#/components/schemas/ConnectedAccount' }
        boards:
          type: array
          items:
            type: object
            required: [board_id, name, pins]
            properties:
              board_id: { type: string }
              name: { type: string }
              pins: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/ImportedPin' } }
        next_before: { type: [string, 'null'], format: date-time }

    DeletionRequest:
      type: object
      required: [id, user_id, state, requested_at, sla_due_at, modules_pending, modules_done, third_parties_done]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: The account that was deleted. }
        state: { type: string, enum: [scheduled, open, overdue, completed, cancelled] }
        requested_at: { type: string, format: date-time }
        purge_after: { type: [string, 'null'], format: date-time, description: When the data is removed. }
        sla_due_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        days_left: { type: [integer, 'null'], description: Negative when overdue. Null once completed. }
        modules_pending: { type: array, items: { type: string }, description: Modules that have not confirmed yet. }
        modules_done: { type: array, items: { type: string } }
        third_parties_done: { type: array, items: { type: string } }

    DeletionRequestList:
      type: object
      required: [items, next_before, summary]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeletionRequest' } }
        next_before: { type: [string, 'null'], format: date-time }
        summary:
          type: object
          required: [scheduled, open, overdue, due_within_5_days, completed, cancelled]
          properties:
            scheduled: { type: integer }
            open: { type: integer }
            overdue: { type: integer }
            due_within_5_days: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }

    Account:
      type: object
      required: [id, status, created_at, quiz_completed, restricted, integrations]
      properties:
        id: { type: string, format: uuid }
        username: { type: [string, 'null'] }
        email_masked: { type: [string, 'null'], example: 'a***@e***.com' }
        status: { type: string }
        created_at: { type: string, format: date-time }
        quiz_completed: { type: boolean }
        restricted: { type: boolean, description: The person restricted processing. }
        integrations: { type: array, items: { type: string } }
        deletion_scheduled: { type: boolean, description: Waiting out the deletion period. }
        purge_after: { type: [string, 'null'], format: date-time }

    AccountList:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        next_before: { type: [string, 'null'], format: date-time }

    Problem:
      type: object
      description: RFC 7807.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }
