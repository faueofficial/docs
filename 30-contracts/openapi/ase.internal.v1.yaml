openapi: 3.1.0

info:
  title: ase Internal API
  version: 1.0.0
  description: |
    Internal styling API. Called by `api-gateway` only, over the private network,
    authenticated with a short-lived service JWT carrying `aud: ase`.

    Never exposed publicly. No user token is accepted here. `ase` trusts the `user_id` (and `workspace_id`) in the request
    because the caller is authenticated as the gateway, which has already checked the person's session, consents and holds.
    A look, job or session that belongs to someone else answers 404, exactly like one that does not exist.

    `ase` receives derived silhouette constraints, never raw body measurements.

servers:
  - url: http://ase.internal:8001
    description: Private network
  - url: http://localhost:8001
    description: Local

security:
  - serviceAuth: []

paths:
  /internal/looks/generate:
    post:
      tags:
      - looks
      summary: Generate
      description: Assemble outfits for a user. Returns a job; poll it. A repeated idempotency key returns the same job.
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  maxLength: 128
                  minLength: 1
                context:
                  additionalProperties: true
                  type: object
                  description: 'The context payload: consents, items, weather, taste, occasion, gender, persona.'
              type: object
              required:
              - user_id
              - workspace_id
              - idempotency_key
              - context
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/jobs/{job_id}:
    get:
      tags:
      - looks
      summary: Get Job
      description: 'Poll a job. `status` is queued, analyzing, assembling, rendering, done or failed. `done` carries the looks;

        `failed` carries a stable reason code and was not counted against the person.'
      security:
      - serviceAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}:
    get:
      tags:
      - looks
      summary: Get Look
      description: Fetch one generated look.
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}/regenerate:
    post:
      tags:
      - looks
      summary: Regenerate
      description: 'A fresh alternative to a look: same occasion and constraints, a different set of pieces. Returns a job.'
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  maxLength: 128
                  minLength: 1
              type: object
              required:
              - user_id
              - idempotency_key
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}/adjust:
    post:
      tags:
      - looks
      summary: Adjust
      description: Move a look along an instruction in plain words (warmer, cooler, less formal, more formal, no black, more
        gold). Returns a job.
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  maxLength: 128
                  minLength: 1
                instruction:
                  type: string
                  maxLength: 120
                  minLength: 1
                  description: 'In the person''s words: warmer, less formal, no black, more gold. Unrecognised words fail the
                    job, uncharged.'
              type: object
              required:
              - user_id
              - idempotency_key
              - instruction
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}/feedback:
    post:
      tags:
      - looks
      summary: Feedback
      description: 'What the person thought of a look. Feeds their memory (what they like, what is never suggested again) when
        they have

        allowed personalisation; otherwise nothing is kept and `recorded` is false.'
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                signal:
                  type: string
                  description: more_like_this | saved | worn | shared | tailor_send | regenerated | dismissed | not_my_style
                reason:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: 'For not_my_style: too_formal | too_casual'
                exploration:
                  type: boolean
                  default: false
              type: object
              required:
              - user_id
              - signal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object

  /internal/looks/{look_id}/image:
    post:
      tags:
      - looks
      summary: Look Image
      description: 'A generated picture of an **archetype** look (a reviewed style card shown to someone whose vault is empty).
  
  
        A look built from the person''s own pieces is **409**: a model could change a garment, so those are shown with the person''s own
  
        photos and never drawn. **424** when pictures cannot be drawn (not configured, switched off, over budget or the provider failed);
  
        the caller then draws its card without a picture.'
      operationId: look_image_internal_looks__look_id__image_post
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
          title: Look Id
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Ase-Service-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/memory:
    get:
      tags:
      - memory
      summary: What Ase Knows
      description: 'Everything ASE has learned about a person, as they see it: liked and disliked colours, cloths, the formality
        lean, items

        never suggested again, how many signals it rests on, and the facts they wrote themselves.'
      security:
      - serviceAuth: []
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory/forget:
    post:
      tags:
      - memory
      summary: Forget
      description: Forget what was learned from one item or one colour. Returns how many signals were removed.
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                item_id:
                  anyOf:
                  - type: string
                    maxLength: 64
                  - type: 'null'
                colour:
                  anyOf:
                  - type: string
                    maxLength: 24
                  - type: 'null'
              type: object
              required:
              - user_id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory/erase:
    post:
      tags:
      - memory
      summary: Erase
      description: 'Erase everything ASE derived about a person: signals, preferences and facts. Used on consent revocation
        and on deletion.'
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
              type: object
              required:
              - user_id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory/facts/{key}:
    put:
      tags:
      - memory
      summary: Put Fact
      description: Keep one short fact the person wrote about their taste. Contact details and measurements are removed; the
        keys are a closed set.
      security:
      - serviceAuth: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                value:
                  type: string
                  maxLength: 400
                  minLength: 1
              type: object
              required:
              - user_id
              - workspace_id
              - value
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
    delete:
      tags:
      - memory
      summary: Delete Fact
      description: Remove one fact.
      security:
      - serviceAuth: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/fabric/suggest:
    post:
      tags:
      - fabric
      summary: Suggest
      description: 'Single-garment styling: what a cloth can really be made into, with a plain line on each.


        Rules select the styles, from the cloth catalogue and the garment glossary (feasibility is physical fact and gates at
        100%).

        A model, when one is available and allowed, only words each line; it cannot add a style. Identifying the cloth from
        a photo

        happens at upload; this takes the cloth as a name.'
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                fabric:
                  type: string
                  maxLength: 80
                  minLength: 1
                  description: A catalogue id or any name for the cloth, such as `aso oke` or `lace`.
                temp_c:
                  anyOf:
                  - type: number
                    maximum: 60.0
                    minimum: -40.0
                  - type: 'null'
                gender:
                  anyOf:
                  - type: string
                    pattern: ^(male|female)$
                  - type: 'null'
                consent:
                  type: boolean
                  description: '`ai_processing` consent. Without it styles are listed with template lines and no model is called.'
                  default: false
              type: object
              required:
              - user_id
              - fabric
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object

  /internal/fabric/style-image:
    post:
      tags:
      - fabric
      summary: Style Image
      description: 'A generated picture of a garment sewn in a cloth, for the tailor card. The cloth has not been made into this yet, so a picture
        is
  
        the honest way to show it. **422** for a cloth or style we do not know; **424** when pictures cannot be drawn.'
      operationId: style_image_internal_fabric_style_image_post
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Ase-Service-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StyleImageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            image/png: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/spree/sessions:
    post:
      tags:
      - spree
      summary: Create Session
      description: Open a conversational styling session. Returns the session id used by the message endpoints.
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
              type: object
              required:
              - user_id
              - workspace_id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/spree/sessions/{session_id}/messages:
    post:
      tags:
      - spree
      summary: Send Message
      description: 'Send a message and get the reply.


        Off-topic input returns a templated refusal and never reaches the chat model (at most one cheap yes/no classification):
        an open-ended chat endpoint that always calls the model

        is an open-ended bill, and the refusal path is what bounds it. Reads only (six read-only tools), at most 4 tool rounds,

        8 calls and 30 seconds. The reply is a single JSON body; streaming arrives with the apps'' chat screen.'
      security:
      - serviceAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 4000
                  minLength: 1
                context:
                  additionalProperties: true
                  type: object
                  description: 'The same context payload as look generation: consents, items, weather, taste, occasion.'
                images:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  description: 'Attachments with the flags the upload pipeline set: apparel, nsfw, minor, readable. Anything
                    not cleared as apparel is refused.'
              type: object
              required:
              - user_id
              - message
              - context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
