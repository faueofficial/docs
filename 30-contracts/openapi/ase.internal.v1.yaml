                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory/forget:
    post:
      tags:
      - memory
      summary: Forget
      description: Forget what was learned from one item or one colour. Returns how many signals were removed.
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                item_id:
                  anyOf:
                  - type: string
                    maxLength: 64
                  - type: 'null'
                colour:
                  anyOf:
                  - type: string
                    maxLength: 24
                  - type: 'null'
              type: object
              required:
              - user_id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory/erase:
    post:
      tags:
      - memory
      summary: Erase
      description: 'Erase everything ASE derived about a person: signals, preferences and facts. Used on consent revocation
        and on deletion.'
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
              type: object
              required:
              - user_id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory/facts/{key}:
    put:
      tags:
      - memory
      summary: Put Fact
      description: Keep one short fact the person wrote about their taste. Contact details and measurements are removed; the
        keys are a closed set.
      security:
      - serviceAuth: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                value:
                  type: string
                  maxLength: 400
                  minLength: 1
              type: object
              required:
              - user_id
              - workspace_id
              - value
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
    delete:
      tags:
      - memory
      summary: Delete Fact
      description: Remove one fact.
      security:
      - serviceAuth: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/fabric/suggest:
    post:
      tags:
      - fabric
      summary: Suggest
      description: 'Single-garment styling: what a cloth can really be made into, with a plain line on each.


        Rules select the styles, from the cloth catalogue and the garment glossary (feasibility is physical fact and gates at
        100%).

        A model, when one is available and allowed, only words each line; it cannot add a style. Identifying the cloth from
        a photo

        happens at upload; this takes the cloth as a name.'
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                fabric:
                  type: string
                  maxLength: 80
                  minLength: 1
                  description: A catalogue id or any name for the cloth, such as `aso oke` or `lace`.
                temp_c:
                  anyOf:
                  - type: number
                    maximum: 60.0
                    minimum: -40.0
                  - type: 'null'
                gender:
                  anyOf:
                  - type: string
                    pattern: ^(male|female)$
                  - type: 'null'
                consent:
                  type: boolean
                  description: '`ai_processing` consent. Without it styles are listed with template lines and no model is called.'
                  default: false
              type: object
              required:
              - user_id
              - fabric
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/spree/sessions:
    post:
      tags:
      - spree
      summary: Create Session
      description: Open a conversational styling session. Returns the session id used by the message endpoints.
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
              type: object
              required:
              - user_id
              - workspace_id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/spree/sessions/{session_id}/messages:
    post:
      tags:
      - spree
      summary: Send Message
      description: 'Send a message and get the reply.


        Off-topic input returns a templated refusal and never reaches the chat model (at most one cheap yes/no classification):
        an open-ended chat endpoint that always calls the model

        is an open-ended bill, and the refusal path is what bounds it. Reads only (six read-only tools), at most 4 tool rounds,

        8 calls and 30 seconds. The reply is a single JSON body; streaming arrives with the apps'' chat screen.'
      security:
      - serviceAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 4000
                  minLength: 1
                context:
                  additionalProperties: true
                  type: object
                  description: 'The same context payload as look generation: consents, items, weather, taste, occasion.'
                images:
                  anyOf:
                  - items:
                      additionalProperties: true
                      type: object
                    type: array
                  - type: 'null'
                  description: 'Attachments with the flags the upload pipeline set: apparel, nsfw, minor, readable. Anything
                    not cleared as apparel is refused.'
              type: object
              required:
              - user_id
              - message
              - context
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/spree/sessions/{session_id}:
    get:
      tags:
      - spree
      summary: Get Session
      description: Read a session transcript back (already redacted), so the gateway can restore a conversation when the app
        reopens.
      security:
      - serviceAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/agent/today:
    post:
      tags:
      - agent
      summary: Today
      description: 'Build today''s proactive suggestion for a user: one look from their wardrobe and a plain line on why.


        Combines the wardrobe, what ASE has learned, the weather and the occasion. Called on a schedule or when the app opens,
        and

        idempotent per day: the surface the user did not ask for must exist before they open the app, and must not cost more
        each time.'
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
