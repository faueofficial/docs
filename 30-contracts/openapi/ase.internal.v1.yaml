components:

  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service JWT, 5-minute lifetime, aud must be "ase".

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: true
      schema: { type: string }
    UserId:
      name: X-User-Id
      in: header
      required: false
      schema: { type: string, format: uuid }

  responses:
    PipelineError:
      description: Expected pipeline outcome or refusal
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, status]
            properties:
              type:
                type: string
                enum: [empty_pool, budget_exceeded, guardrail_blocked, model_unavailable, render_failed, context_unavailable, invalid_constraints]
              status: { type: integer }
              detail: { type: string }
              stage:
                type: string
                enum: [context, filter, assemble, rank, render, explain]

  schemas:

    Constraints:
      type: object
      description: Derived silhouette rules. Never raw measurements.
      properties:
        favor: { type: array, items: { type: string } }
        avoid: { type: array, items: { type: string } }
        fit_preference: { type: [string, 'null'], enum: [fitted, regular, relaxed, null] }
        sizes: { type: object, additionalProperties: { type: string } }

    JobStatus:
      type: object
      required: [job_id, status, progress]
      properties:
        job_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, analyzing, assembling, rendering, done, failed]
        progress: { type: integer, minimum: 0, maximum: 100 }
        label: { type: string }
        result:
          type: [object, 'null']
          properties:
            look_ids: { type: array, items: { type: string, format: uuid } }
        error:
          type: [object, 'null']
          properties:
            reason_code: { type: string }
            stage: { type: string }

    Look:
      type: object
      required: [look_id, title, items, renderer]
      properties:
        look_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        why_this_works: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri }
        occasion: { type: [string, 'null'] }
        renderer: { type: string, enum: [generative, composite, hybrid] }
        score: { type: [number, 'null'] }
        strategy_version: { type: string }
        prompt_version: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name: { type: string }
              role: { type: string }
              vault_item_id: { type: [string, 'null'], format: uuid }
              image_url: { type: [string, 'null'], format: uri }
              note: { type: [string, 'null'] }

    FabricAnalysis:
      type: object
      required: [detected_type, confidence, styles]
      properties:
        detected_type:
          type: string
          enum: [ankara, lace, aso_oke, adire, cotton, chiffon, other]
        confidence: { type: number, minimum: 0, maximum: 1 }
        attributes:
          type: object
          properties:
            motif_scale: { type: string, enum: [small, medium, large] }
            weight: { type: string, enum: [light, medium, heavy] }
            dominant_colors: { type: array, items: { type: string } }
        styles:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: object
            required: [style_id, name, reason]
            properties:
              style_id: { type: string, format: uuid }
              name: { type: string }
              reference_image_url: { type: [string, 'null'], format: uri }
              reason: { type: string }
              formality: { type: string }
              accessories:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    image_url: { type: [string, 'null'], format: uri }
                    note: { type: [string, 'null'] }

    AgentSuggestion:
      type: object
      required: [run_id, look_id, trigger]
      properties:
        run_id: { type: string, format: uuid }
        look_id: { type: string, format: uuid }
        trigger:
          type: string
          enum: [daily, weather, event, proactive, on_demand]
        rationale: { type: string }
        weather:
          oneOf:
            - $ref: '#/components/schemas/Weather'
            - type: 'null'

    OccasionSignal:
      type: object
      required: [key, name, status, intensity]
      properties:
        key:
          type: string
          example: detty_december
        name: { type: string }
        status:
          type: string
          enum: [active, upcoming, inactive]
        days_until:
          type: [integer, 'null']
          description: Null when the window is already active.
        intensity:
          type: number
          minimum: 0
          maximum: 1
          description: How strongly this window should bias generation.
        occasions:
          type: array
          items: { type: string }
          description: Which occasions this window amplifies.

    Weather:
      type: object
      properties:
        temp_c: { type: number }
        feels_like_c: { type: number }
        condition: { type: string }
        rain_probability: { type: number }
        humidity: { type: number }
        uv: { type: number }
        dust_index:
          type: [number, 'null']
          description: Harmattan season Saharan dust level. Nigeria-specific.
