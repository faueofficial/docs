      description: Opaque cursor from the previous page's `next_cursor`.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LookId:
      name: look_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: 'Seconds to wait' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConsentRequired:
      description: |
        A required consent purpose has not been granted. Present the consent surface
        for the purpose named in `errors[0].field`, not a generic error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    PinterestPins:
      properties:
        board_id:
          type: string
          title: Board Id
        pins:
          items:
            $ref: '#/components/schemas/PinterestPin'
          type: array
          title: Pins
        next_bookmark:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Bookmark
          description: Send it back as `bookmark` for the next page. Null on the last page.
      type: object
      required:
      - board_id
      - pins
      title: PinterestPins
    PinterestPin:
      properties:
        pin_id:
          type: string
          title: Pin Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: On Pinterest's image host only. Null for a pin with no image (a video, say).
        imported:
          type: boolean
          title: Imported
      type: object
      required:
      - pin_id
      - imported
      title: PinterestPin
    GenerateIn:
      properties:
        occasion:
          anyOf:
          - type: string
          - type: 'null'
          title: Occasion
          description: owambe, wedding, church, corporate, casual, date_night, travel or funeral.
        event_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Event Id
          description: One of your own events. Its kind sets the occasion when you send none, and the look is dressed for it.
        mood:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          title: Mood
          description: 'How you want it to feel, in your words: elegant, bold, understated. Used only with personalisation consent.'
        note:
          anyOf:
          - type: string
            maxLength: 280
          - type: 'null'
          title: Note
          description: Anything else, in your words. Used only with personalisation consent; contact details are removed.
      type: object
      title: GenerateIn
    AgentSettingsIn:
      properties:
        daily_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Daily Enabled
          description: A suggestion each day. Needs the `agent_proactive` consent to turn on.
        daily_hour_local:
          anyOf:
          - type: integer
            maximum: 23.0
            minimum: 0.0
          - type: 'null'
          title: Daily Hour Local
          description: The hour, Lagos time, the daily suggestion is for.
        use_weather:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Use Weather
          description: Dress for today's weather. Only used with location consent.
        autonomy_level:
          anyOf:
          - type: integer
            maximum: 3.0
            minimum: 0.0
          - type: 'null'
          title: Autonomy Level
          description: 0 on open, 1 daily push, 2 proactive triggers, 3 planning. Level 1 and above need `agent_proactive`.
      type: object
      title: AgentSettingsIn
      description: Send only what you are changing; the rest is kept.
    Measurement:
      properties:
        label:
          type: string
          maxLength: 24
          minLength: 1
          title: Label
          examples:
          - Chest
        value:
          type: string
          maxLength: 16
          minLength: 1
          title: Value
          examples:
          - '42'
      type: object
      required:
      - label
      - value
      title: Measurement
    ShareIn:
      properties:
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
          description: 'Where it is going: whatsapp_status, instagram_story, instagram_feed, whatsapp_chat, square, x or link_preview. Picks the default
            shape; every shape is listed.'
      type: object
      title: ShareIn
    TailorShareIn:
      properties:
        style:
          type: string
          maxLength: 90
          minLength: 1
          title: Style
          description: The style chosen, as the heading of the card.
          examples:
          - Agbada with a matching fila
        fabric:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Fabric
          description: The cloth's name, for example `aso oke`. Also lets the card show an illustration of the style.
        garment:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Garment
          description: What to make, in a line.
        colours:
          items:
            type: string
          type: array
          maxItems: 3
          title: Colours
          description: Up to three colours, for the illustration.
        note:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          title: Note
        measurements:
          items:
            $ref: '#/components/schemas/Measurement'
          type: array
          maxItems: 14
          title: Measurements
        unit:
          type: string
          pattern: ^(in|cm)$
          title: Unit
          default: in
        include_illustration:
          type: boolean
          title: Include Illustration
          description: Add a generated illustration of the style in this cloth when one can be drawn. Needs `ai_processing` consent; the card is made
            without it otherwise.
          default: true
      type: object
      required:
      - style
      title: TailorShareIn
    StudioEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string, enum: [wedding, owambe, church, naming, work, travel, other] }
        starts_on: { type: string, format: date }
        city: { type: string, nullable: true }
        has_fabric: { type: boolean }
        reminders: { type: array, items: { type: string, enum: ['0d', 1d, 3d, 7d] }, description: Longest lead first. }
        days_until: { type: integer }

    Tailor:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, description: E.164 }
        is_default: { type: boolean }

    AseNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        source: { type: string, enum: [user, learned] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }


    Problem:
      type: object
      description: RFC 7807 problem document.
      required: [type, title, status]
      properties:
        type: { type: string, example: 'consent_required', description: 'Stable machine-readable code. Branch on this, never on `title`.' }
        title: { type: string, example: 'Consent required' }
        status: { type: integer, example: 403 }
        detail: { type: string, description: 'Human-readable. Safe to log, never shown raw to users.' }
        instance: { type: string, description: 'Trace id for support' }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    Page:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    Session:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, is_new_user, onboarding]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer], description: 'How to present the access token.' }
        expires_in: { type: integer, example: 900, description: 'Seconds until the access token expires.' }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer, example: 2592000, description: 'Seconds until the refresh token expires.' }
        is_new_user: { type: boolean, description: 'Route to onboarding rather than the dashboard.' }
        onboarding:
          allOf: [{ $ref: '#/components/schemas/OnboardingState' }]
          description: >
            Included on sign-in so the app can route straight from the auth screen
            without a second call. Absent from `/auth/refresh` — refresh runs every
            twelve minutes and no screen reads this at that moment.

    RefreshedSession:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in, is_new_user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer, example: 2592000 }
        is_new_user: { type: boolean }

    Profile:
      type: object
      required: [user_id, username]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: [string, 'null'] }
        display_name: { type: [string, 'null'] }
        gender_presentation: { $ref: '#/components/schemas/GenderPresentation' }
        city: { type: [string, 'null'] }
        locale: { type: string, example: 'en-NG' }
        avatar_url: { type: [string, 'null'], format: uri }
        created_at: { type: string, format: date-time }

    OnboardingState:
      type: object
      description: Drives which onboarding step the app resumes at.
      required: [username_set, quiz_completed, pinterest_connected, vault_started, body_profile_set]
      properties:
        username_set: { type: boolean }
        quiz_completed: { type: boolean }
        pinterest_connected: { type: boolean }
        vault_started: { type: boolean }
        body_profile_set: { type: boolean }

    GenderPresentation:
      type: [string, 'null']
      enum: [feminine, masculine, fluid, prefer_not_to_say, null]

    BodyProfile:
      type: object
      description: |
        Sensitive. Every field optional. Encrypted at rest, never sent raw to a model —
        `ase` receives abstract silhouette constraints instead.
      properties:
        body_shape: { type: [string, 'null'], enum: [hourglass, pear, rectangle, inverted_triangle, apple, triangle, oval, null] }
        height_cm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        fit_preference: { type: [string, 'null'], enum: [fitted, regular, relaxed, null] }
        sizes_by_category:
          type: object
          additionalProperties: { type: string }
          example: { tops: M, bottoms: '32', shoes: '43' }
        measurements:
          type: [object, 'null']
          description: Optional expansion. Absent for most users.
          additionalProperties: { type: number }

    Consent:
      type: object
      required: [purpose, granted]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        granted: { type: boolean }
        policy_version: { type: [string, 'null'] }
        granted_at: { type: [string, 'null'], format: date-time }

    ConsentPurpose:
      type: string
      enum: [essential, personalization, ai_processing, pinterest_sync, camera_photos, location_weather, agent_proactive, marketing_comms, analytics]

    QuizDefinition:
      type: object
      required: [quiz_version, questions]
      properties:
        quiz_version: { type: string, example: 'dna-2026-08-v1' }
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, options]
            properties:
              id: { type: integer }
              prompt: { type: string }
              subtitle: { type: [string, 'null'] }
              progress: { type: integer, description: 'Percentage to show on this screen' }
              max_choices:
                type: integer
                minimum: 1
                description: |
                  How many options may be ticked. 1 means a single choice (radio buttons); more means
                  checkboxes, up to this many. Ticked options share the question's weight equally, so
                  choosing more never gives a question a bigger say. Absent from a gateway that predates
                  multiple answers: treat that as 1.
              options:
                type: array
                description: Length varies by question — Q6 has three. Build the layout from this.
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string, example: 'A' }
                    label: { type: string, example: 'Minimal' }
                    description: { type: string }
                    image_url: { type: [string, 'null'], format: uri }

    DnaResult:
      type: object
      required: [quiz_version, dominant, scores, completed_at]
      properties:
        quiz_version: { type: string }
        dominant: { $ref: '#/components/schemas/PersonaResult' }
        alter_ego: { oneOf: [{ $ref: '#/components/schemas/PersonaResult' }, { type: 'null' }] }
        wildcard: { oneOf: [{ $ref: '#/components/schemas/PersonaResult' }, { type: 'null' }] }
        tagline:
          type: string
          description: 'Tier 1 persona line. Fixed per persona.'
        blend_line:
          type: string
          description: 'Tier 2. Varies by dominant x alter-ego pair; 30 hand-written variants.'
        personal_line:
          type: [string, 'null']
          description: 'Tier 3 (M1-2). Generated once from the answer pattern, then frozen. Null when absent — close the layout up rather than leaving a gap.'
        scores:
          type: object
          description: Raw scores per persona id. Display uses the percentages on each persona.
          additionalProperties: { type: number }
        card_urls: { $ref: '#/components/schemas/CardUrls' }
        completed_at: { type: string, format: date-time }
        retake_available_at: { type: string, format: date-time }

    PersonaResult:
      type: object
      required: [id, name, percentage]
      properties:
        id: { type: string, enum: [CM, OR, SL, SC, CE, NF] }
        name: { type: string, example: 'The Cultural Minimalist' }
        percentage: { type: integer, description: 'Percentages across shown personas total exactly 100' }
        gradient_from: { type: string, example: '#0F3D2E' }
        gradient_to: { type: string, example: '#355C4F' }

    CardUrls:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, ready, failed] }
        square_url: { type: [string, 'null'], format: uri }
        stories_url: { type: [string, 'null'], format: uri, description: 'A 1080x1920 PNG for Stories, WhatsApp status and TikTok.' }
        share_url: { type: [string, 'null'], format: uri, description: 'The public page for this card. Pasting it into a chat shows a link preview of the card.' }

    SharedCard:
      type: object
      required: [username, persona, persona_id, percentage, blend, tagline, title, description, images]
      properties:
        username: { type: [string, 'null'], description: 'The handle signed on the card, if it has one.' }
        persona: { type: string, example: 'The Cultural Minimalist' }
        persona_id: { type: string, example: CM }
        percentage: { type: integer, description: 'The dominant persona percentage.' }
        blend:
          type: array
          description: 'Dominant first. Percentages total 100.'
          items:
            type: object
            required: [id, name, percentage]
            properties:
              id: { type: string, example: CE }
              name: { type: string, example: Corporate Edge }
              percentage: { type: integer }
        tagline: { type: string }
        blend_line: { type: string }
        title: { type: string, example: 'ada_obi is The Cultural Minimalist on FAUE' }
        description: { type: string }
        images:
          type: object
          required: [preview, story, post]
          properties:
            preview: { type: string, format: uri, description: '1200x630, for link previews.' }
            story: { type: string, format: uri, description: '1080x1920.' }
            post: { type: string, format: uri, description: '1080x1350.' }

    UnsubscribeResult:
      type: object
      required: [category, unsubscribed]
      properties:
        category: { type: string, example: waitlist }
        unsubscribed: { type: boolean, enum: [true] }

    Asset:
      type: object
      required: [asset_id, status]
      properties:
        asset_id: { type: string, format: uuid }
        status: { type: string, enum: [processing, ready, rejected] }
        url: { type: [string, 'null'], format: uri, description: 'The redacted derivative. The original is not exposed.' }
        rejection_reason: { type: [string, 'null'], enum: [unsafe_content, not_apparel, unreadable, too_large, null] }

    VaultCategory:
      type: string
      enum: [tops, bottoms, native, shoes, accessories]

    VaultItem:
      type: object
      required: [item_id, name, category, image_url, created_at]
      properties:
        item_id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/VaultCategory' }
        colors: { type: array, items: { type: string } }
        fabric: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        image_url: { type: string, format: uri }
        wear_count: { type: integer }
        last_worn_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    Occasion:
      type: [string, 'null']
      enum: [owambe, wedding, corporate, casual, date_night, church, travel, custom, null]

    SharedItem:
      type: object
      required: [id, source, source_url, status, created_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [tiktok, instagram, pinterest, image] }
        source_url: { type: [string, 'null'], description: 'The canonical post address; null for an image alone.' }
        title: { type: [string, 'null'], description: Untrusted text. Render as plain text. }
        author_name: { type: [string, 'null'], description: Untrusted text. Render as plain text. }
        thumbnail_url: { type: [string, 'null'], description: 'The platform''s own preview address. Prefer the upload when `asset_id` is set.' }
        asset_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [ready, needs_image] }
        reason: { type: [string, 'null'], enum: [no_preview, unavailable, null] }
        created_at: { type: string, format: date-time }

    JobEnvelope:
      type: object
      required: [job_id, status, poll_url]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        poll_url: { type: string, format: uri }
        stream_url: { type: [string, 'null'], format: uri }
        estimated_seconds: { type: integer, example: 30 }

    JobStatus:
      type: object
      required: [job_id, status, progress]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, analyzing, assembling, rendering, done, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        label: { type: string, example: 'Building your fit…' }
        result:
          type: [object, 'null']
          properties:
            look_ids: { type: array, items: { type: string, format: uuid } }
        error:
          type: [object, 'null']
          properties:
            reason_code: { type: string, enum: [empty_pool, model_unavailable, render_failed, budget_exceeded, guardrail_blocked, timeout, internal] }
            message: { type: string, description: 'User-safe copy matching the designed error state' }

    LookSummary:
      type: object
      required: [look_id, title, image_url, created_at]
      properties:
        look_id: { type: string, format: uuid }
        title: { type: string, example: 'Cultural Evening Flow' }
        image_url: { type: string, format: uri }
        occasion: { $ref: '#/components/schemas/Occasion' }
        is_saved: { type: boolean }
        created_at: { type: string, format: date-time }

    Look:
      allOf:
        - $ref: '#/components/schemas/LookSummary'
        - type: object
          required: [items, description]
          properties:
            description: { type: string, description: 'The look''s summary paragraph' }
            why_this_works: { type: [string, 'null'], description: 'Personalised explanation referencing the user''s Style DNA' }
            generated_by_ai: { type: boolean, description: 'When true the app shows the "generated by FAUE AI" attribution' }
            renderer: { type: string, enum: [generative, composite, hybrid] }
            items:
              type: array
              items:
                type: object
                required: [name, role]
                properties:
                  name: { type: string, example: 'Relaxed Linen Shirt' }
                  role: { type: string, example: 'top' }
                  vault_item_id: { type: [string, 'null'], format: uuid, description: 'Present when the piece is one the user owns' }
                  image_url: { type: [string, 'null'], format: uri }
                  note: { type: [string, 'null'] }

    FabricType:
      type: string
      enum: [ankara, lace, aso_oke, adire, cotton, chiffon, other]

    FabricAnalysis:
      type: object
      required: [asset_id, detected_type, confidence, styles]
      properties:
        asset_id: { type: string, format: uuid }
        detected_type: { $ref: '#/components/schemas/FabricType' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        attributes:
          type: object
          properties:
            motif_scale: { type: string, enum: [small, medium, large] }
            weight: { type: string, enum: [light, medium, heavy] }
            dominant_colors: { type: array, items: { type: string } }
        styles:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: object
            required: [style_id, name, reason]
            properties:
              style_id: { type: string, format: uuid }
              name: { type: string, example: 'Fitted Kaftan with Side Slit' }
              reference_image_url: { type: string, format: uri }
              reason: { type: string, description: 'Why this style suits this specific fabric' }
              formality: { type: string, enum: [casual, smart_casual, formal, ceremonial] }
              accessories:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    image_url: { type: [string, 'null'], format: uri }
                    note: { type: string }

    SpreeMessage:
      type: object
      required: [role, content, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        image_urls: { type: array, items: { type: string, format: uri } }
        refused: { type: boolean, description: 'True when a guardrail produced a templated refusal' }
        created_at: { type: string, format: date-time }

    AgentSuggestion:
      type: object
      required: [run_id, look, trigger, generated_at]
      properties:
        run_id: { type: string, format: uuid }
        look: { $ref: '#/components/schemas/LookSummary' }
        trigger: { type: string, enum: [daily, weather, event, proactive, on_demand] }
        rationale: { type: string, description: 'Answers "why this?" from stored facts, not a fresh model guess.' }
        weather:
          type: [object, 'null']
          properties:
            temp_c: { type: number }
            condition: { type: string }
            rain_probability: { type: number }
            dust_index: { type: [number, 'null'], description: 'Harmattan season dust level' }
        generated_at: { type: string, format: date-time }

    AgentSettings:
      type: object
      properties:
        daily_enabled: { type: boolean }
        daily_hour_local: { type: integer, minimum: 0, maximum: 23 }
        use_weather: { type: boolean }
        autonomy_level: { type: integer, minimum: 0, maximum: 3, description: '0 on-open, 1 daily push, 2 proactive triggers, 3 planning' }
        built_level: { type: integer, description: 'The highest autonomy_level that does anything today (0). Higher levels are stored for when they exist.' }

    Integration:
      type: object
      required: [provider, connected]
      properties:
        provider: { type: string, enum: [pinterest] }
        connected: { type: boolean }
        connected_at: { type: [string, 'null'], format: date-time }
        last_sync_at: { type: [string, 'null'], format: date-time }
        boards_imported: { type: integer }
        pins_imported: { type: integer }
        status: { type: string, enum: [active, needs_reauth, revoked, syncing] }

    PinterestBoard:
      type: object
      required: [board_id, name, pin_count]
      properties:
        board_id: { type: string }
        name: { type: string }
        pin_count: { type: integer }
        cover_image_url: { type: [string, 'null'], format: uri }
        imported: { type: boolean }

    InboxItem:
      type: object
      required: [notification_id, title, category, created_at, read]
      properties:
        notification_id: { type: string, format: uuid }
        title: { type: string, example: 'New Style Generated' }
        body: { type: string, example: 'Your Crimson Elegance look is ready to explore' }
        category: { type: string, enum: [style, activity] }
        deeplink: { type: [string, 'null'], format: uri }
        image_url: { type: [string, 'null'], format: uri }
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationPreference:
      type: object
      required: [category, channel, enabled]
      properties:
        category: { type: string, enum: [style, activity, marketing] }
        channel: { type: string, enum: [push, email, whatsapp, sms, inbox] }
        enabled: { type: boolean }
        quiet_hours_start: { type: [integer, 'null'], minimum: 0, maximum: 23 }
        quiet_hours_end: { type: [integer, 'null'], minimum: 0, maximum: 23 }
