openapi: 3.1.0

info:
  title: ase Internal API
  version: 1.0.0
  description: |
    Internal styling API. Called by `api-gateway` only, over the private network,
    authenticated with a short-lived service JWT carrying `aud: ase`.

    Never exposed publicly. No user token is accepted here. `ase` trusts the `user_id` (and `workspace_id`) in the request
    because the caller is authenticated as the gateway, which has already checked the person's session, consents and holds.
    A look, job or session that belongs to someone else answers 404, exactly like one that does not exist.

    `ase` receives derived silhouette constraints, never raw body measurements.

servers:
  - url: http://ase.internal:8001
    description: Private network
  - url: http://localhost:8001
    description: Local

security:
  - serviceAuth: []

paths:
  /internal/looks/generate:
    post:
      tags:
      - looks
      summary: Generate
      description: Assemble outfits for a user. Returns a job; poll it. A repeated idempotency key returns the same job.
      security:
      - serviceAuth: []
      parameters:
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  maxLength: 128
                  minLength: 1
                context:
                  additionalProperties: true
                  type: object
                  description: 'The context payload: consents, items, weather, taste, occasion, gender, persona.'
              type: object
              required:
              - user_id
              - workspace_id
              - idempotency_key
              - context
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/jobs/{job_id}:
    get:
      tags:
      - looks
      summary: Get Job
      description: 'Poll a job. `status` is queued, analyzing, assembling, rendering, done or failed. `done` carries the looks;

        `failed` carries a stable reason code and was not counted against the person.'
      security:
      - serviceAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}:
    get:
      tags:
      - looks
      summary: Get Look
      description: Fetch one generated look.
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}/regenerate:
    post:
      tags:
      - looks
      summary: Regenerate
      description: 'A fresh alternative to a look: same occasion and constraints, a different set of pieces. Returns a job.'
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  maxLength: 128
                  minLength: 1
              type: object
              required:
              - user_id
              - idempotency_key
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}/adjust:
    post:
      tags:
      - looks
      summary: Adjust
      description: Move a look along an instruction in plain words (warmer, cooler, less formal, more formal, no black, more
        gold). Returns a job.
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  maxLength: 128
                  minLength: 1
                instruction:
                  type: string
                  maxLength: 120
                  minLength: 1
                  description: 'In the person''s words: warmer, less formal, no black, more gold. Unrecognised words fail the
                    job, uncharged.'
              type: object
              required:
              - user_id
              - idempotency_key
              - instruction
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/looks/{look_id}/feedback:
    post:
      tags:
      - looks
      summary: Feedback
      description: 'What the person thought of a look. Feeds their memory (what they like, what is never suggested again) when
        they have

        allowed personalisation; otherwise nothing is kept and `recorded` is false.'
      security:
      - serviceAuth: []
      parameters:
      - name: look_id
        in: path
        required: true
        schema:
          type: string
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                user_id:
                  type: string
                  format: uuid
                workspace_id:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                signal:
                  type: string
                  description: more_like_this | saved | worn | shared | tailor_send | regenerated | dismissed | not_my_style
                reason:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: 'For not_my_style: too_formal | too_casual'
                exploration:
                  type: boolean
                  default: false
              type: object
              required:
              - user_id
              - signal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                properties:
                  detail:
                    items:
                      properties:
                        loc:
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                          type: array
                        msg:
                          type: string
                        type:
                          type: string
                        input: {}
                        ctx:
                          type: object
                      type: object
                      required:
                      - loc
                      - msg
                      - type
                    type: array
                type: object
  /internal/memory:
    get:
      tags:
      - memory
      summary: What Ase Knows
      description: 'Everything ASE has learned about a person, as they see it: liked and disliked colours, cloths, the formality
        lean, items

        never suggested again, how many signals it rests on, and the facts they wrote themselves.'
      security:
      - serviceAuth: []
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Ase-Service-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
      responses:
        '200':
